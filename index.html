<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mariana & Filippo | 07.08.2027</title>
  <meta name="description" content="Mariana & Filippo — 7 August 2027">

  <!-- Elegant wedding typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: #10140f;
      color: #fff;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
    }

    /* Your uploaded wedding photograph */
    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: -3;
      animation: imageIn 1.8s ease-out both;
    }

    /* Soft dark overlay: keeps the photograph visible while making text readable */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(8, 12, 8, 0.20) 0%,
          rgba(8, 12, 8, 0.10) 32%,
          rgba(8, 12, 8, 0.38) 72%,
          rgba(8, 12, 8, 0.72) 100%
        );
      z-index: -2;
    }

    /* Very subtle overall vignette */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0, 0, 0, 0.25) 100%
      );
      z-index: -1;
      pointer-events: none;
    }

    .content {
      width: min(1100px, 92vw);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0;
      animation: contentIn 1.4s 0.2s ease-out both;
    }

    .names {
      font-family: "Allura", cursive;
      font-size: clamp(5rem, 10vw, 9rem);
      font-weight: 400;
      line-height: 0.85;
      letter-spacing: 0;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.20);
      white-space: nowrap;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin: 28px 0 17px;
      color: #c9a55c;
    }

    .ornament-line {
      width: 55px;
      height: 1px;
      background: rgba(201, 165, 92, 0.85);
    }

    .ornament-leaf {
      font-size: 17px;
      line-height: 1;
      transform: rotate(-8deg);
    }

    .date {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(0.95rem, 2vw, 1.25rem);
      font-weight: 400;
      letter-spacing: 0.38em;
      padding-left: 0.38em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.30);
    }

    .languages {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 52px;
      width: 100%;
    }

    .language-button {
      width: min(220px, 27vw);
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;

      border: 1px solid rgba(201, 165, 92, 0.80);
      border-radius: 6px;
      background: rgba(5, 9, 7, 0.20);
      color: #fff;
      text-decoration: none;

      font-family: "Montserrat", sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .language-button:hover {
      background: rgba(201, 165, 92, 0.18);
      border-color: rgba(231, 207, 154, 1);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .flag {
      font-size: 1.15rem;
      line-height: 1;
    }

    .welcome {
      margin-top: 45px;
      color: rgba(225, 195, 133, 0.95);
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.30em;
      text-transform: uppercase;
    }

    .heart {
      margin-top: 13px;
      color: #c9a55c;
      font-size: 1.35rem;
      font-family: Georgia, serif;
      animation: heartbeat 2.5s ease-in-out infinite;
    }

    @keyframes imageIn {
      from {
        opacity: 0;
        transform: scale(1.035);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* Tablet */
    @media (max-width: 800px) {
      .names {
        font-size: clamp(4.2rem, 15vw, 7rem);
      }

      .languages {
        gap: 10px;
        margin-top: 42px;
      }

      .language-button {
        width: 30vw;
        min-height: 58px;
        font-size: 0.62rem;
        letter-spacing: 0.10em;
      }
    }

    /* Phone */
    @media (max-width: 560px) {
      .hero-image {
        object-position: 53% center;
      }

      .hero::before {
        background:
          linear-gradient(
            180deg,
            rgba(8, 12, 8, 0.18) 0%,
            rgba(8, 12, 8, 0.12) 30%,
            rgba(8, 12, 8, 0.48) 70%,
            rgba(8, 12, 8, 0.78) 100%
          );
      }

      .content {
        width: 92vw;
        padding: 30px 0 25px;
      }

      .names {
        font-size: clamp(4rem, 19vw, 6.2rem);
        line-height: 0.82;
      }

      .ornament {
        margin: 24px 0 15px;
      }

      .ornament-line {
        width: 38px;
      }

      .date {
        font-size: 0.82rem;
        letter-spacing: 0.27em;
        padding-left: 0.27em;
      }

      .languages {
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 38px;
      }

      .language-button {
        width: min(285px, 76vw);
        min-height: 51px;
        font-size: 0.64rem;
      }

      .welcome {
        margin-top: 28px;
        font-size: 0.53rem;
        letter-spacing: 0.22em;
      }

      .heart {
        margin-top: 8px;
        font-size: 1.15rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-image,
      .content,
      .heart {
        animation: none;
      }

      .language-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!--
      IMPORTANT:
      Upload your wedding photograph to this same GitHub repository
      and name it exactly: wedding.jpg

      If you use another filename, change "wedding.jpg" below.
    -->
    <img
      class="hero-image"
      src="wedding.jpg"
      alt="Mariana and Filippo"
    >

    <div class="content">

      <h1 class="names">Mariana &amp; Filippo</h1>

      <div class="ornament" aria-hidden="true">
        <span class="ornament-line"></span>
        <span class="ornament-leaf">❧</span>
        <span class="ornament-line"></span>
      </div>

      <p class="date">07 . 08 . 2027</p>

      <!--
        REPLACE THE THREE URLs BELOW with your Carrd websites.
      -->
      <nav class="languages" aria-label="Choose language">

        <a
          class="language-button"
          href="https://YOUR-PT-SITE.carrd.co/"
          aria-label="Português"
        >
          <span class="flag">🇵🇹</span>
          <span>Português</span>
        </a>

        <a
          class="language-button"
          href="https://YOUR-IT-SITE.carrd.co/"
          aria-label="Italiano"
        >
          <span class="flag">🇮🇹</span>
          <span>Italiano</span>
        </a>

        <a
          class="language-button"
          href="https://YOUR-EN-SITE.carrd.co/"
          aria-label="English"
        >
          <span class="flag">🇬🇧</span>
          <span>English</span>
        </a>

      </nav>

      <p class="welcome">Welcome to our wedding</p>
      <div class="heart" aria-hidden="true">♡</div>

    </div>
  </main>

</body>
</html>

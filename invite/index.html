<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mariana & Filippo — Convite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --champagne-title: #B89257;
            --champagne-detail: #B88D4D;
            --champagne-light: #F5E8CF;
            --cream: #FFF8EC;
            --gold-border: #C7AA7B;
            --brown-main: #735238;
            --brown-light: #8C6A4D;
            --brown-dark: #563C2B;
            --bg-outside: #3A4432;
            --background-opacity: 0.78;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-color: var(--bg-outside);
        }

        #envelope-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
            background-color: transparent;
            overflow: hidden;
            transition: background-color 0.85s ease, opacity 0.35s ease, visibility 0.35s ease;
        }

        .env-corpo-img,
        .env-aba-img {
            position: absolute;
            width: 150%;
            height: 150%;
            left: -25%;
            top: -29.9%;
            object-fit: fill;
            pointer-events: none;
            user-select: none;
        }

        .env-corpo-img {
            z-index: 2;
            transform: translateY(0);
            transition: transform 1.15s cubic-bezier(0.65,0,0.35,1);
        }

        .env-aba-container {
            position: absolute;
            inset: 0;
            z-index: 4;
            transform: translateY(0);
            transition: transform 1.15s cubic-bezier(0.65,0,0.35,1);
        }

        .env-aba-img {
            z-index: 4;
        }

        .selo-img {
            position: absolute;
            left: 50%;
            top: 65%;
            width: clamp(180px,22vw,300px);
            height: auto;
            transform: translate(-50%,-50%) scale(1);
            z-index: 6;
            filter: drop-shadow(0 8px 14px rgba(0,0,0,0.42));
            transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.22,0.61,0.36,1);
        }

        .open-hint-text {
            position: absolute;
            left: 50%;
            bottom: 7%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.82);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            animation: pulse 2s infinite;
            transition: opacity 0.4s ease;
            z-index: 7;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #envelope-screen.opening {
            cursor: default;
        }

        #envelope-screen.opening .env-aba-container {
            transform: translateY(-110vh);
        }

        #envelope-screen.opening .env-corpo-img {
            transform: translateY(110vh);
        }

        #envelope-screen.opening .selo-img {
            opacity: 0;
            transform: translate(-50%,-50%) scale(0.65);
        }

        #envelope-screen.opening .open-hint-text {
            opacity: 0;
        }

        #envelope-screen.opened {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #main-site {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            opacity: 0;
            overflow: hidden;
            background-color: #DED4C4;
            transition: opacity 0.35s ease;
        }

        #main-site::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center bottom;
            background-attachment: fixed;
            opacity: var(--background-opacity);
            z-index: 0;
            pointer-events: none;
        }

        #main-site.visible {
            opacity: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 12px;
            border: 2px solid var(--gold-border);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #1A1A1A;
        }

        .content-wrapper::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid var(--gold-border);
            border-radius: 6px;
            pointer-events: none;
            z-index: 3;
            opacity: 0.6;
        }

        .card-bg-slider {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #1A1A1A;
        }

        .bg-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 55% 50%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .bg-photo.active {
            opacity: 1;
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: transparent;
            z-index: 1;
            pointer-events: none;
        }

        .card-content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 70px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 45px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--brown-light);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0.82;
            padding-bottom: 4px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            color: var(--brown-dark);
            opacity: 1;
        }

        .lang-btn.active {
            opacity: 1;
            color: var(--brown-dark);
            border-bottom: 1px solid var(--brown-dark);
            font-weight: 700;
        }

        .welcome-text {
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(245,238,228,0.78);
            margin-bottom: 15px;
            text-shadow: 0 2px 8px rgba(111,78,55,0.18);
        }

        .names-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }

        .names-title {
            position: relative;
            font-family: 'Allura', cursive;
            font-size: 82px;
            color: var(--champagne-title);
            line-height: 1.1;
            text-align: center;
            text-shadow:
                0 1px 0 rgba(255,248,235,0.55),
                0 3px 7px rgba(255,244,221,0.34),
                0 7px 18px rgba(90,63,37,0.20),
                0 0 20px rgba(255,241,214,0.18);
        }

        .name-line {
            display: inline-block;
        }

        .elegant-divider {
            border: none;
            border-bottom: 1px solid var(--champagne-title);
            width: 50px;
            margin: 20px auto 35px;
            opacity: 0.7;
        }

        .quote-phrase {
            font-size: 15px;
            font-weight: 300;
            line-height: 1.8;
            max-width: 650px;
            margin: 0 auto 60px;
        }

        .elegant-divider,
        .quote-phrase {
            visibility: hidden;
            pointer-events: none;
        }

        .event-details {
            position: relative;
            isolation: isolate;
            padding: 18px 38px 20px;
            margin-bottom: 42px;
        }

        .event-details::before {
            content: '';
            position: absolute;
            inset: -28px -48px -25px;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255,249,238,0.38) 0%,
                    rgba(255,247,232,0.24) 30%,
                    rgba(255,245,225,0.11) 50%,
                    rgba(255,245,225,0.00) 76%
                );
            filter: blur(15px);
        }

        .date-text {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--champagne-detail);
            margin-bottom: 10px;
            text-shadow:
                0 1px 0 rgba(255,248,234,0.64),
                0 3px 8px rgba(255,242,215,0.28),
                0 6px 14px rgba(82,57,30,0.28),
                0 0 14px rgba(255,242,215,0.20);
        }

        .time-text {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--cream);
            margin-bottom: 30px;
            text-shadow:
                0 2px 5px rgba(70,47,28,0.38),
                0 0 8px rgba(255,244,224,0.14);
        }

        .location-info {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.7;
            color: var(--cream);
            margin-bottom: 25px;
            text-shadow:
                0 2px 5px rgba(68,47,29,0.40),
                0 0 9px rgba(255,244,224,0.14);
        }

        .location-info strong {
            display: inline-block;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.7px;
            color: var(--champagne-detail);
            text-shadow:
                0 1px 0 rgba(255,249,236,0.68),
                0 3px 7px rgba(255,240,211,0.26),
                0 5px 13px rgba(75,51,27,0.32),
                0 0 13px rgba(255,243,218,0.22);
        }

        .map-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 0;
            color: var(--brown-main);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.35px;
            text-transform: uppercase;
            text-decoration: none;
            text-shadow:
                0 0 4px rgba(255,250,240,0.98),
                0 0 8px rgba(255,246,228,0.92),
                0 0 15px rgba(255,242,218,0.62),
                0 2px 5px rgba(79,55,33,0.18);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .map-link:hover {
            color: var(--brown-dark);
            transform: translateY(-1px);
        }

        .map-icon {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter:
                drop-shadow(0 0 3px rgba(255,250,240,1))
                drop-shadow(0 0 6px rgba(255,244,222,0.8));
        }

        .buttons-group {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
        }

        .action-btn {
            display: inline-block;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 16px 20px;
            border-radius: 4px;
            flex: 1 1 0;
            max-width: 200px;
            background-color: rgba(255,248,238,0.60);
            border: 1px solid rgba(111,78,55,0.68);
            color: var(--brown-dark);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 7px 18px rgba(68,48,29,0.10);
            transition: all 0.35s ease;
        }

        .action-btn:hover {
            background-color: rgba(111,78,55,0.94);
            border-color: var(--brown-main);
            color: #FFF8ED;
            transform: translateY(-1px);
        }

        .rsvp-text {
            display: inline-block;
            margin-bottom: 40px;
            padding: 6px 8px;
            color: var(--brown-dark);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2.5px;
            line-height: 1.4;
            text-transform: uppercase;
            text-decoration: none;
            text-shadow:
                0 0 4px rgba(255,251,244,1),
                0 0 8px rgba(255,248,236,1),
                0 0 14px rgba(255,244,225,0.96),
                0 0 24px rgba(255,238,210,0.72),
                0 0 34px rgba(255,236,205,0.46),
                0 2px 6px rgba(75,52,31,0.16);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .rsvp-text:hover {
            color: var(--brown-main);
            transform: translateY(-1px);
        }

        @media (min-width: 768px) {
            .names-title {
                font-size: 110px;
            }
        }

        @media (max-width: 600px) {
            #envelope-screen {
                background: #1A1E16;
            }

            .env-corpo-img {
                width: 150vw;
                height: 147.84dvh;
                max-width: none;
                max-height: none;
                left: -25vw;
                top: -29.2dvh;
                object-fit: fill;
            }

            .env-aba-container {
                overflow: hidden;
            }

            .env-aba-img {
                height: 120dvh;
                width: auto;
                max-width: none;
                max-height: none;
                left: 50%;
                top: -14.18dvh;
                transform: translateX(-50%);
                object-fit: contain;
                object-position: center top;
            }

            .selo-img {
                width: clamp(150px,42vw,195px);
                top: 65%;
            }

            #main-site {
                padding: 15px;
            }

            #main-site::before {
                background-attachment: scroll;
            }

            .content-wrapper {
                min-height: calc(100dvh - 30px);
                border: 2px solid var(--gold-border);
            }

            .bg-photo {
                object-position: 55% 50%;
            }

            .card-content {
                padding: 50px 20px;
            }

            .lang-bar {
                margin-bottom: 35px;
                gap: 15px;
            }

            .welcome-text {
                font-size: 9px;
                letter-spacing: 4px;
            }

            .names-title {
                font-size: 64px;
            }

            .name-line {
                display: block;
            }

            .quote-phrase {
                font-size: 14px;
                margin-bottom: 45px;
            }

            .event-details {
                padding: 18px 18px 16px;
                margin-bottom: 38px;
            }

            .event-details::before {
                inset: -24px -28px -20px;
                filter: blur(13px);
            }

            .date-text {
                font-size: 28px;
                letter-spacing: 3px;
            }

            .time-text {
                font-size: 14px;
                margin-bottom: 25px;
            }

            .location-info {
                font-size: 15px;
            }

            .location-info strong {
                font-size: 17px;
            }

            .map-link {
                font-size: 9px;
                letter-spacing: 1.1px;
            }

            .buttons-group {
                flex-direction: column;
                gap: 12px;
                align-items: center;
                margin-bottom: 20px;
            }

            .action-btn {
                width: 100%;
                max-width: 250px;
                flex: none;
                padding: 14px 20px;
                background-color: rgba(255,248,238,0.64);
            }

            .rsvp-text {
                font-size: 10px;
                letter-spacing: 1.9px;
                margin-bottom: 30px;
                text-shadow:
                    0 0 4px rgba(255,251,244,1),
                    0 0 8px rgba(255,248,236,1),
                    0 0 13px rgba(255,244,225,0.96),
                    0 0 21px rgba(255,238,210,0.72),
                    0 0 30px rgba(255,236,205,0.45);
            }
        }
    </style>
</head>

<body>

    <div id="envelope-screen" onclick="openEnvelope()">
        <img src="envelope-corpo.png" alt="Corpo do Envelope" class="env-corpo-img">

        <div class="env-aba-container">
            <img src="envelope-aba.png" alt="Aba do Envelope" class="env-aba-img">
        </div>

        <img src="selo.png" alt="Selo de Cera" class="selo-img" onerror="this.style.display='none';">

        <p class="open-hint-text" id="txt-hint">
            Clique para abrir
        </p>
    </div>

    <div id="main-site">
        <div class="content-wrapper">

            <div class="card-bg-slider">
                <img
                    src="foto1.jpg"
                    alt="Fundo"
                    class="bg-photo active"
                    onerror="this.src='https://i.pinimg.com/236x/9b/7c/14/9b7c145e25c4265bbffc61648509b196.jpg'"
                >
                <div class="bg-overlay"></div>
            </div>

            <div class="card-content">

                <div class="lang-bar">
                    <button class="lang-btn active" onclick="setLang('pt')" id="btn-pt">PT</button>
                    <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
                    <button class="lang-btn" onclick="setLang('it')" id="btn-it">IT</button>
                </div>

                <div class="welcome-text" id="txt-welcome">
                    BEM-VINDOS AO CASAMENTO DE
                </div>

                <div class="names-wrapper">
                    <h1 class="names-title">
                        <span class="name-line">Mariana</span>
                        <span class="name-line">&amp; Filippo</span>
                    </h1>
                </div>

                <hr class="elegant-divider">

                <p class="quote-phrase" id="txt-phrase">
                    Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.
                </p>

                <div class="event-details">

                    <div class="date-text" id="txt-date">
                        07 . 08 . 2027
                    </div>

                    <div class="time-text" id="txt-time">
                        15:00
                    </div>

                    <div class="location-info" id="txt-location">
                        <strong>Ca' Salva</strong><br>
                        Teolo, Itália
                    </div>

                    <a
                        href="https://maps.app.goo.gl/WTEPBw1iE51htJrn6"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="map-link"
                    >
                        <svg class="map-icon" viewBox="0 0 24 24">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>

                        <span id="txt-map">
                            Ver no mapa
                        </span>
                    </a>

                </div>

                <div class="buttons-group">

                    <a
                        href="https://marianafilippo.pt/pt"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="action-btn"
                        id="txt-btn-site"
                    >
                        Website
                    </a>

                    <a
                        href="https://marianafilippo.pt/gifts"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="action-btn"
                        id="txt-btn-gifts"
                    >
                        Presentes
                    </a>

                </div>

                <a
                    href="https://marianafilippo.pt/pt/#rsvp"
                    class="rsvp-text"
                    id="txt-rsvp"
                >
                    CONFIRME A SUA PRESENÇA
                </a>

            </div>
        </div>
    </div>

    <script>
        const texts = {
            pt: {
                hint: "Clique para abrir",
                welcome: "BEM-VINDOS AO CASAMENTO DE",
                phrase: "Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.",
                date: "07 . 08 . 2027",
                location: "<strong>Ca' Salva</strong><br>Teolo, Itália",
                btnSite: "Website",
                siteLink: "https://marianafilippo.pt/pt",
                btnGifts: "Presentes",
                map: "Ver no mapa",
                rsvp: "CONFIRME A SUA PRESENÇA",
                rsvpLink: "https://marianafilippo.pt/pt/#rsvp"
            },

            en: {
                hint: "Click to open",
                welcome: "WELCOME TO THE WEDDING OF",
                phrase: "With endless joy, we invite you to celebrate our wedding day with us.",
                date: "07 . 08 . 2027",
                location: "<strong>Ca' Salva</strong><br>Teolo, Italy",
                btnSite: "Website",
                siteLink: "https://marianafilippo.pt/en",
                btnGifts: "Gift Registry",
                map: "View on map",
                rsvp: "CONFIRM YOUR ATTENDANCE",
                rsvpLink: "https://marianafilippo.pt/en/#rsvp"
            },

            it: {
                hint: "Clicca per aprire",
                welcome: "BENVENUTI AL MATRIMONIO DI",
                phrase: "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",
                date: "07 . 08 . 2027",
                location: "<strong>Ca' Salva</strong><br>Teolo, Italia",
                btnSite: "Il nostro sito",
                siteLink: "https://marianafilippo.pt/it",
                btnGifts: "Lista Nozze",
                map: "Vedi sulla mappa",
                rsvp: "CONFERMATE LA VOSTRA PRESENZA",
                rsvpLink: "https://marianafilippo.pt/it/#rsvp"
            }
        };

        let currentLang = 'pt';

        window.addEventListener('DOMContentLoaded', () => {
            const browserLang = (navigator.language || navigator.userLanguage)
                .slice(0,2)
                .toLowerCase();

            const supportedLangs = ['pt','en','it'];

            if (supportedLangs.includes(browserLang)) {
                setLang(browserLang);
            } else {
                setLang('en');
            }
        });

        function openEnvelope() {
            const screen = document.getElementById('envelope-screen');
            const mainSite = document.getElementById('main-site');

            if (screen.classList.contains('opening')) return;

            mainSite.classList.add('visible');
            screen.classList.add('opening');

            setTimeout(() => {
                screen.classList.add('opened');
            }, 1250);
        }

        function setLang(lang) {
            currentLang = lang;

            const t = texts[lang];

            document.getElementById('txt-hint').innerText = t.hint;
            document.getElementById('txt-welcome').innerText = t.welcome;
            document.getElementById('txt-phrase').innerText = t.phrase;
            document.getElementById('txt-date').innerText = t.date;
            document.getElementById('txt-location').innerHTML = t.location;

            document.getElementById('txt-btn-site').innerText = t.btnSite;
            document.getElementById('txt-btn-site').href = t.siteLink;

            document.getElementById('txt-btn-gifts').innerText = t.btnGifts;
            document.getElementById('txt-map').innerText = t.map;

            document.getElementById('txt-rsvp').innerText = t.rsvp;
            document.getElementById('txt-rsvp').href = t.rsvpLink;

            document
                .querySelectorAll('.lang-btn')
                .forEach(btn => btn.classList.remove('active'));

            const activeBtn = document.getElementById(`btn-${lang}`);

            if (activeBtn) {
                activeBtn.classList.add('active');
            }
        }
    </script>

</body>
</html>

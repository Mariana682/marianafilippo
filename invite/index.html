<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mariana & Filippo — Convite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta inspirada nos tons quentes das rochas da fotografia */
            --gold-main: #B89463;
            --gold-deep: #8F6C43;
            --gold-light: #F5EEE4;
            --gold-border: #C7AA7B;

            /* Opacidade da fotografia */
            --photo-opacity: 0.78;

            /* Véu quente sobre a fotografia */
            --dark-overlay: rgba(39, 29, 20, 0.30);

            --bg-outside: #3A4432;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-color: var(--bg-outside);
        }


        /* =========================================================
           ENVELOPE
        ========================================================= */

        #envelope-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
            background-color: transparent;
            overflow: hidden;

            transition:
                background-color 0.85s ease,
                opacity 0.35s ease,
                visibility 0.35s ease;
        }

        .env-corpo-img,
        .env-aba-img {
            position: absolute;
            width: 150%;
            height: 150%;
            left: -25%;
            top: -29.9%;
            object-fit: fill;
            pointer-events: none;
            user-select: none;
        }

        .env-corpo-img {
            z-index: 2;
            transform: translateY(0);

            transition:
                transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .env-aba-container {
            position: absolute;
            inset: 0;
            z-index: 4;
            transform: translateY(0);

            transition:
                transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .env-aba-img {
            z-index: 4;
        }

        .selo-img {
            position: absolute;
            left: 50%;
            top: 65%;

            width: clamp(180px, 22vw, 300px);
            height: auto;

            transform: translate(-50%, -50%) scale(1);

            z-index: 6;

            filter:
                drop-shadow(0 8px 14px rgba(0, 0, 0, 0.42));

            transition:
                opacity 0.45s ease,
                transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .open-hint-text {
            position: absolute;
            left: 50%;
            bottom: 7%;

            transform: translateX(-50%);

            color: rgba(255, 255, 255, 0.82);

            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;

            animation: pulse 2s infinite;

            transition:
                opacity 0.4s ease;

            z-index: 7;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        #envelope-screen.opening {
            background-color: transparent;
            cursor: default;
        }

        #envelope-screen.opening .env-aba-container {
            transform: translateY(-110vh);
        }

        #envelope-screen.opening .env-corpo-img {
            transform: translateY(110vh);
        }

        #envelope-screen.opening .selo-img {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0.65);
        }

        #envelope-screen.opening .open-hint-text {
            opacity: 0;
        }

        #envelope-screen.opened {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* =========================================================
           PÁGINA PRINCIPAL
        ========================================================= */

        #main-site {
            position: relative;

            width: 100vw;
            min-height: 100vh;

            background-image:
                url('background.jpg');

            background-size: cover;
            background-position: center bottom;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            opacity: 0;

            transform: scale(1);

            transition:
                opacity 0.35s ease;
        }

        #main-site.visible {
            opacity: 1;
        }


        /* =========================================================
           CARTÃO PRINCIPAL
        ========================================================= */

        .content-wrapper {
            position: relative;

            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            border-radius: 12px;

            border:
                2px solid
                var(--gold-border);

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.5);

            overflow: hidden;

            min-height: 85vh;

            display: flex;
            flex-direction: column;
            justify-content: center;

            /* Fundo base se a fotografia não carregar */
            background-color: #1A1A1A;
        }


        /* Segunda linha decorativa dentro da moldura */

        .content-wrapper::after {
            content: '';

            position: absolute;

            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;

            border:
                1px solid
                var(--gold-border);

            border-radius: 6px;

            pointer-events: none;

            z-index: 3;

            opacity: 0.6;
        }


        /* =========================================================
           FOTOGRAFIA DE FUNDO
        ========================================================= */

        .card-bg-slider {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 0;

            /*
            Fundo castanho para aparecer por baixo da fotografia
            quando usamos transparência.
            */
            background: #241C16;
        }

        .bg-photo {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            opacity: 0;

            transition:
                opacity 2s ease-in-out;
        }

        .bg-photo.active {
            opacity: var(--photo-opacity);
        }


        /*
        Véu subtil castanho/champanhe.
        Ajuda a uniformizar a imagem e aumenta a legibilidade.
        */

        .bg-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    rgba(86, 63, 39, 0.08),
                    rgba(36, 27, 20, 0.12)
                ),
                var(--dark-overlay);

            z-index: 1;
        }


        /* =========================================================
           CONTEÚDO
        ========================================================= */

        .card-content {
            position: relative;

            z-index: 2;

            width: 100%;

            padding: 70px 40px;

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================================================
           SELETOR DE IDIOMA
        ========================================================= */

        .lang-bar {
            display: flex;

            justify-content: center;

            gap: 20px;

            margin-bottom: 45px;
        }

        .lang-btn {
            background: none;
            border: none;

            /*
            Cor um pouco mais escura que anteriormente
            para não desaparecer nas zonas claras da fotografia.
            */
            color: #D8C5A6;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 2px;

            cursor: pointer;

            opacity: 0.72;

            padding-bottom: 4px;

            text-shadow:
                0 1px 3px
                rgba(0, 0, 0, 0.28);

            transition:
                all 0.3s ease;
        }

        .lang-btn.active {
            opacity: 1;

            border-bottom:
                1px solid
                var(--gold-deep);

            color:
                var(--gold-deep);

            font-weight: 700;
        }


        /* =========================================================
           TEXTO DE INTRODUÇÃO
        ========================================================= */

        .welcome-text {
            font-size: 10px;

            letter-spacing: 5px;

            text-transform: uppercase;

            color:
                var(--gold-light);

            margin-bottom: 15px;
        }


        /* =========================================================
           NOMES
        ========================================================= */

        .names-wrapper {
            position: relative;

            display: inline-block;

            width: 100%;

            margin-bottom: 10px;
        }

        .names-title {
            position: relative;

            font-family:
                'Allura',
                cursive;

            font-size: 82px;

            color:
                var(--gold-main);

            line-height: 1.1;

            text-align: center;

            text-shadow:
                2px 4px 10px
                rgba(0, 0, 0, 0.4);
        }

        .name-line {
            display: inline-block;
        }

        @media (min-width: 768px) {
            .names-title {
                font-size: 110px;
            }
        }


        /* =========================================================
           TRAÇO + FRASE
           
           IMPORTANTE:
           permanecem no HTML e continuam a ocupar exatamente
           o mesmo espaço vertical de antes.

           Só deixaram de ser visíveis.
        ========================================================= */

        .elegant-divider {
            border: none;

            border-bottom:
                1px solid
                var(--gold-main);

            width: 50px;

            margin:
                20px auto 35px auto;

            opacity: 0.7;
        }

        .quote-phrase {
            font-size: 15px;

            font-weight: 300;

            color:
                var(--gold-light);

            line-height: 1.8;

            max-width: 650px;

            margin:
                0 auto 60px;

            text-shadow:
                1px 1px 4px
                rgba(0, 0, 0, 0.5);
        }


        /*
        Em vez de display:none,
        usamos visibility:hidden.

        Assim desaparecem visualmente,
        mas continuam a ocupar exatamente o espaço original.
        */

        .elegant-divider,
        .quote-phrase {
            visibility: hidden;

            pointer-events: none;
        }


        /* =========================================================
           DATA / HORA / LOCAL
        ========================================================= */

        .event-details {
            margin-bottom: 45px;
        }

        .date-text {
            font-size: 34px;

            font-weight: 600;

            letter-spacing: 4px;

            color:
                var(--gold-main);

            margin-bottom: 8px;

            text-shadow:
                1px 2px 5px
                rgba(0, 0, 0, 0.3);
        }

        .time-text {
            font-size: 16px;

            font-weight: 400;

            letter-spacing: 3px;

            color:
                var(--gold-light);

            margin-bottom: 30px;
        }

        .location-info {
            font-size: 16px;

            font-weight: 300;

            line-height: 1.7;

            color:
                var(--gold-light);

            margin-bottom: 25px;

            text-shadow:
                1px 1px 3px
                rgba(0, 0, 0, 0.5);
        }

        .location-info strong {
            font-weight: 500;

            color:
                var(--gold-main);

            letter-spacing: 1px;

            font-size: 17px;
        }


        /* =========================================================
           MAPA
        ========================================================= */

        .map-link {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-bottom: 35px;

            color:
                var(--gold-main);

            font-size: 10px;

            font-weight: 500;

            letter-spacing: 1.6px;

            text-transform: uppercase;

            text-decoration: none;

            transition:
                opacity 0.3s ease;
        }

        .map-link:hover {
            opacity: 0.7;
        }

        .map-icon {
            width: 14px;
            height: 14px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.5;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =========================================================
           BOTÕES
        ========================================================= */

        .buttons-group {
            display: flex;

            flex-direction: row;

            justify-content: center;

            gap: 15px;

            margin-bottom: 40px;

            width: 100%;
        }

        .action-btn {
            display: inline-block;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            padding: 16px 20px;

            border-radius: 4px;

            flex: 1 1 0;

            max-width: 200px;

            /*
            Fundo discretamente transparente,
            mantendo a fotografia visível.
            */
            background-color:
                rgba(245, 238, 228, 0.10);

            border:
                1px solid
                var(--gold-deep);

            /*
            Letras mais escuras para ganhar contraste.
            */
            color:
                var(--gold-deep);

            text-shadow:
                0 1px 2px
                rgba(255, 255, 255, 0.16);

            backdrop-filter:
                blur(3px);

            -webkit-backdrop-filter:
                blur(3px);

            transition:
                all 0.4s ease;
        }

        .action-btn:hover {
            background-color:
                var(--gold-deep);

            border-color:
                var(--gold-deep);

            color:
                #FFF9F1;
        }


        /* =========================================================
           TELEMÓVEL
        ========================================================= */

        @media (max-width: 600px) {

            #envelope-screen {
                background: #1A1E16;
            }

            .env-corpo-img {
                width: 150vw;
                height: 147.84dvh;

                max-width: none;
                max-height: none;

                left: -25vw;
                top: -29.2dvh;

                object-fit: fill;
            }

            .env-aba-container {
                overflow: hidden;
            }

            .env-aba-img {
                height: 120dvh;
                width: auto;

                max-width: none;
                max-height: none;

                left: 50%;
                top: -14.18dvh;

                transform:
                    translateX(-50%);

                object-fit: contain;

                object-position:
                    center top;
            }

            .selo-img {
                width:
                    clamp(
                        150px,
                        42vw,
                        195px
                    );

                top: 65%;
            }

            #main-site {
                padding: 15px;
            }

            .content-wrapper {
                /*
                Altura mínima ajustada para caber no telemóvel
                sem cortar a moldura.
                */
                min-height:
                    calc(100dvh - 30px);

                border:
                    2px solid
                    var(--gold-border);
            }

            .card-content {
                padding: 50px 20px;
            }

            .lang-bar {
                margin-bottom: 35px;

                gap: 15px;
            }

            .welcome-text {
                font-size: 9px;

                letter-spacing: 4px;
            }

            .names-title {
                font-size: 64px;
            }

            .name-line {
                display: block;
            }

            /*
            Continua invisível,
            mas conserva o espaço original
            que tinha no layout de telemóvel.
            */
            .quote-phrase {
                font-size: 14px;

                margin-bottom: 45px;
            }

            .date-text {
                font-size: 28px;
            }

            .time-text {
                font-size: 14px;

                margin-bottom: 25px;
            }

            .location-info {
                font-size: 15px;
            }

            .buttons-group {
                flex-direction: column;

                gap: 12px;

                align-items: center;
            }

            .action-btn {
                width: 100%;

                max-width: 250px;

                flex: none;

                padding: 14px 20px;
            }
        }
    </style>
</head>

<body>


    <!-- =========================================================
         ENVELOPE
    ========================================================== -->

    <div
        id="envelope-screen"
        onclick="openEnvelope()"
    >

        <img
            src="envelope-corpo.png"
            alt="Corpo do Envelope"
            class="env-corpo-img"
        >

        <div class="env-aba-container">

            <img
                src="envelope-aba.png"
                alt="Aba do Envelope"
                class="env-aba-img"
            >

        </div>

        <img
            src="selo.png"
            alt="Selo de Cera"
            class="selo-img"
            onerror="this.style.display='none';"
        >

        <p
            class="open-hint-text"
            id="txt-hint"
        >
            Clique para abrir
        </p>

    </div>


    <!-- =========================================================
         SITE
    ========================================================== -->

    <div id="main-site">

        <div class="content-wrapper">


            <!-- =================================================
                 FOTOGRAFIA
            ================================================== -->

            <div class="card-bg-slider">

                <img
                    src="foto1.jpg"
                    alt="Fundo"
                    class="bg-photo active"
                    onerror="this.src='https://i.pinimg.com/236x/9b/7c/14/9b7c145e25c4265bbffc61648509b196.jpg'"
                >

                <div class="bg-overlay"></div>

            </div>


            <!-- =================================================
                 CONTEÚDO
            ================================================== -->

            <div class="card-content">


                <!-- IDIOMAS -->

                <div class="lang-bar">

                    <button
                        class="lang-btn active"
                        onclick="setLang('pt')"
                        id="btn-pt"
                    >
                        PT
                    </button>

                    <button
                        class="lang-btn"
                        onclick="setLang('en')"
                        id="btn-en"
                    >
                        EN
                    </button>

                    <button
                        class="lang-btn"
                        onclick="setLang('it')"
                        id="btn-it"
                    >
                        IT
                    </button>

                </div>


                <!-- TEXTO DE INTRODUÇÃO -->

                <div
                    class="welcome-text"
                    id="txt-welcome"
                >
                    BEM-VINDOS AO CASAMENTO DE
                </div>


                <!-- NOMES -->

                <div class="names-wrapper">

                    <h1 class="names-title">

                        <span class="name-line">
                            Mariana
                        </span>

                        <span class="name-line">
                            &amp; Filippo
                        </span>

                    </h1>

                </div>


                <!--
                O traço continua aqui,
                mas está invisível através do CSS.
                Continua a ocupar exatamente o mesmo espaço.
                -->

                <hr class="elegant-divider">


                <!--
                A frase também continua no HTML,
                mas está invisível.

                Isto permite preservar exatamente
                a distância original até à data.
                -->

                <p
                    class="quote-phrase"
                    id="txt-phrase"
                >
                    Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.
                </p>


                <!-- DETALHES -->

                <div class="event-details">


                    <!-- DATA -->

                    <div
                        class="date-text"
                        id="txt-date"
                    >
                        07 . 08 . 2027
                    </div>


                    <!-- HORA -->

                    <div
                        class="time-text"
                        id="txt-time"
                    >
                        15:00
                    </div>


                    <!-- LOCAL -->

                    <div
                        class="location-info"
                        id="txt-location"
                    >

                        <strong>
                            Ca' Salva
                        </strong>

                        <br>

                        Teolo, Itália

                    </div>


                    <!-- MAPA -->

                    <a
                        href="https://maps.app.goo.gl/WTEPBw1iE51htJrn6"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="map-link"
                    >

                        <svg
                            class="map-icon"
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"
                            ></path>

                            <circle
                                cx="12"
                                cy="10"
                                r="3"
                            ></circle>

                        </svg>

                        <span id="txt-map">
                            Ver no mapa
                        </span>

                    </a>

                </div>


                <!-- BOTÕES -->

                <div class="buttons-group">

                    <a
                        href="https://marianafilippo.pt"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="action-btn"
                        id="txt-btn-site"
                    >
                        Website
                    </a>

                    <a
                        href="https://marianafilippo.pt/gifts"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="action-btn"
                        id="txt-btn-gifts"
                    >
                        Presentes
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        const texts = {

            pt: {

                hint:
                    "Clique para abrir",

                welcome:
                    "BEM-VINDOS AO CASAMENTO DE",

                /*
                Continua definido para manter o código consistente,
                embora a frase esteja invisível.
                */
                phrase:
                    "Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Itália",

                btnSite:
                    "Website",

                btnGifts:
                    "Presentes",

                map:
                    "Ver no mapa"
            },


            en: {

                hint:
                    "Click to open",

                welcome:
                    "WELCOME TO THE WEDDING OF",

                phrase:
                    "With endless joy, we invite you to celebrate our wedding day with us.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Italy",

                btnSite:
                    "Website",

                btnGifts:
                    "Gift Registry",

                map:
                    "View on map"
            },


            it: {

                hint:
                    "Clicca per aprire",

                welcome:
                    "BENVENUTI AL MATRIMONIO DI",

                phrase:
                    "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Italia",

                btnSite:
                    "Il nostro sito",

                btnGifts:
                    "Lista Nozze",

                map:
                    "Vedi sulla mappa"
            }

        };


        let currentLang = 'pt';


        /* =========================================================
           DETEÇÃO AUTOMÁTICA DO IDIOMA
        ========================================================== */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                const browserLang =
                    (
                        navigator.language ||
                        navigator.userLanguage
                    )
                    .slice(0, 2)
                    .toLowerCase();


                const supportedLangs = [
                    'pt',
                    'en',
                    'it'
                ];


                if (
                    supportedLangs.includes(
                        browserLang
                    )
                ) {

                    setLang(
                        browserLang
                    );

                } else {

                    setLang(
                        'en'
                    );

                }

            }
        );


        /* =========================================================
           ABRIR ENVELOPE
        ========================================================== */

        function openEnvelope() {

            const screen =
                document.getElementById(
                    'envelope-screen'
                );


            const mainSite =
                document.getElementById(
                    'main-site'
                );


            /*
            Impede que a animação seja ativada
            várias vezes em cliques sucessivos.
            */

            if (
                screen.classList.contains(
                    'opening'
                )
            ) {

                return;

            }


            /*
            O site aparece imediatamente por trás
            enquanto o envelope se afasta.
            */

            mainSite.classList.add(
                'visible'
            );


            screen.classList.add(
                'opening'
            );


            /*
            Depois da animação,
            retiramos completamente o envelope
            da interação.
            */

            setTimeout(
                () => {

                    screen.classList.add(
                        'opened'
                    );

                },

                1250
            );

        }


        /* =========================================================
           ALTERAR IDIOMA
        ========================================================== */

        function setLang(lang) {

            currentLang =
                lang;


            const t =
                texts[lang];


            document
                .getElementById(
                    'txt-hint'
                )
                .innerText =
                    t.hint;


            document
                .getElementById(
                    'txt-welcome'
                )
                .innerText =
                    t.welcome;


            /*
            A frase é atualizada normalmente,
            apesar de permanecer invisível.
            Isto garante que a estrutura continua
            consistente nos três idiomas.
            */

            document
                .getElementById(
                    'txt-phrase'
                )
                .innerText =
                    t.phrase;


            document
                .getElementById(
                    'txt-date'
                )
                .innerText =
                    t.date;


            document
                .getElementById(
                    'txt-location'
                )
                .innerHTML =
                    t.location;


            document
                .getElementById(
                    'txt-btn-site'
                )
                .innerText =
                    t.btnSite;


            document
                .getElementById(
                    'txt-btn-gifts'
                )
                .innerText =
                    t.btnGifts;


            document
                .getElementById(
                    'txt-map'
                )
                .innerText =
                    t.map;


            /*
            Retira o estado ativo
            de todos os idiomas.
            */

            document
                .querySelectorAll(
                    '.lang-btn'
                )
                .forEach(
                    btn =>
                        btn.classList.remove(
                            'active'
                        )
                );


            /*
            Ativa apenas o idioma escolhido.
            */

            const activeBtn =
                document.getElementById(
                    `btn-${lang}`
                );


            if (activeBtn) {

                activeBtn.classList.add(
                    'active'
                );

            }

        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariana & Filippo — Convite</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            var(--sage-green): #6a7b5e; 
            --accent-gold: #D4AF37;
            --text-dark: #2C332A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            background-color: #F9F6F0;
        }

        /* --- 1. ENVELOPE FULLSCREEN REALISTA --- */
        #envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s ease, visibility 1.2s;
            background-color: #1a2017;
        }

        #envelope-screen.opened {
            opacity: 0;
            transform: scale(1.1);
            visibility: hidden;
        }

        .paper-texture {
            background-color: #6a7b5e;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.12'/%3E%3C/svg%3E");
        }

        .env-body {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .env-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 52vh;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 2;
            filter: drop-shadow(0px 12px 15px rgba(0,0,0,0.5));
        }

        .env-seal-container {
            position: absolute;
            top: 52vh;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .env-seal-img {
            width: 110px;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        .env-seal-container:hover .env-seal-img {
            transform: scale(1.05);
        }

        .open-hint-text {
            margin-top: 15px;
            color: rgba(255,255,255,0.8);
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* --- 2. SITE PRINCIPAL (COM AGUARELA DE FUNDO) --- */
        #main-site {
            width: 100vw;
            min-height: 100vh;
            
            /* A TUA AGUARELA */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center bottom; /* Foca a parte inferior da imagem (a quinta) */
            background-attachment: fixed; /* O fundo fica fixo enquanto fazes scroll */
            
            display: flex;
            justify-content: center;
            align-items: center; /* Centra o cartão no ecrã */
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 1.5s ease 0.3s;
        }

        #main-site.visible {
            opacity: 1;
        }

        /* --- EFEITO CARTÃO TRANSLÚCIDO (VELLUM) --- */
        .content-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            
            /* Fundo quase branco com alguma transparência */
            background: rgba(253, 251, 247, 0.90);
            /* Desfoca ligeiramente o que está por trás do cartão */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #6a7b5e;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0.4;
            padding-bottom: 4px;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            opacity: 1;
            border-bottom: 2px solid #6a7b5e;
        }

        .names-title {
            font-family: 'Allura', cursive;
            font-size: 68px;
            color: #6a7b5e;
            line-height: 1;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .names-title { font-size: 86px; }
        }

        .quote-phrase {
            font-size: 14px;
            font-weight: 300;
            color: #4a5247;
            line-height: 1.8;
            margin-bottom: 45px;
        }

        /* --- MOLDURA FLORAL (ESTILO ETSY) --- */
        .photo-frame-wrapper {
            position: relative;
            width: 260px;
            height: 350px;
            margin: 0 auto 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .couple-photo {
            position: absolute;
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 120px 120px 10px 10px;
            z-index: 1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .floral-overlay-img {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
        }

        .event-details {
            margin-bottom: 35px;
        }

        .date-text {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 3px;
            color: #6a7b5e;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .location-info {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.7;
            color: #3b4239;
            margin-bottom: 25px;
        }

        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 45px;
            align-items: center;
        }

        .action-btn {
            display: inline-block;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 16px 32px;
            border-radius: 30px;
            width: 100%;
            max-width: 280px;
            transition: all 0.3s ease;
        }

        .btn-site {
            background-color: #6a7b5e;
            color: #ffffff;
        }

        .btn-gifts {
            background-color: #E8D8B0;
            color: #4a3a0f;
        }

        .iban-footer {
            padding-top: 25px;
            border-top: 1px solid rgba(106, 123, 94, 0.2);
        }

        .iban-pill {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0,0,0,0.05);
            font-family: monospace;
            font-size: 13px;
            margin-top: 15px;
        }

        .copy-link {
            background: none;
            border: none;
            color: #6a7b5e;
            font-weight: 600;
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- 1. ENVELOPE FULLSCREEN -->
    <div id="envelope-screen" onclick="openEnvelope()">
        <div class="env-body paper-texture"></div>
        <div class="env-flap paper-texture"></div>
        
        <div class="env-seal-container">
            <img src="selo.png" alt="Selo de Cera" class="env-seal-img" onerror="this.style.display='none';">
            <p class="open-hint-text" id="txt-hint">Clique para abrir</p>
        </div>
    </div>

    <!-- 2. CONVITE -->
    <div id="main-site">
        <!-- Cartão Central Translúcido -->
        <div class="content-wrapper">
            
            <div class="lang-bar">
                <button class="lang-btn active" onclick="setLang('pt')">PT</button>
                <button class="lang-btn" onclick="setLang('en')">EN</button>
                <button class="lang-btn" onclick="setLang('it')">IT</button>
            </div>

            <h1 class="names-title">Mariana & Filippo</h1>

            <p class="quote-phrase" id="txt-phrase">
                Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.
            </p>

            <div class="photo-frame-wrapper">
                <img src="foto-noivos.jpg" alt="Mariana & Filippo" class="couple-photo" onerror="this.src='https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=400&q=80'">
                <img src="moldura.png" alt="Moldura Floral" class="floral-overlay-img" onerror="this.style.display='none';">
            </div>

            <div class="event-details">
                <div class="date-text" id="txt-date">07 . 08 . 2027</div>
                <div class="location-info" id="txt-location">
                    <strong>Quinta dos Sonhos</strong><br>
                    Coimbra, Portugal
                </div>
            </div>

            <div class="buttons-group">
                <a href="https://marianafilippo.pt" target="_blank" class="action-btn btn-site" id="txt-btn-site">O Nosso Site</a>
                <a href="https://marianafilippo.pt/#presentes" target="_blank" class="action-btn btn-gifts" id="txt-btn-gifts">Lista de Presentes</a>
            </div>

            <div class="iban-footer">
                <p style="font-size: 12px; color: #666;" id="txt-iban-intro">Para quem deseja mimar-nos de forma direta:</p>
                <div class="iban-pill">
                    <span id="iban-code">PT50 0000 0000 0000 0000 0000 0</span>
                    <button class="copy-link" onclick="copyIBAN()" id="txt-copy">Copiar</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const texts = {
            pt: {
                hint: "Clique para abrir",
                phrase: "Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.",
                date: "07 . 08 . 2027",
                location: "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portugal",
                btnSite: "O Nosso Site",
                btnGifts: "Lista de Presentes",
                ibanIntro: "Para quem nos perguntou e deseja mimar-nos de forma direta:",
                copy: "Copiar",
                copied: "Copiado"
            },
            en: {
                hint: "Click to open",
                phrase: "With endless joy, we invite you to celebrate our wedding day with us.",
                date: "07 . 08 . 2027",
                location: "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portugal",
                btnSite: "Our Website",
                btnGifts: "Gift Registry",
                ibanIntro: "For those who kindly asked and wish to gift us directly:",
                copy: "Copy",
                copied: "Copied"
            },
            it: {
                hint: "Clicca per aprire",
                phrase: "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",
                date: "07 . 08 . 2027",
                location: "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portogallo",
                btnSite: "Il Nostro Sito",
                btnGifts: "Lista Nozze",
                ibanIntro: "Per chi desidera farci un pensiero in modo diretto:",
                copy: "Copia",
                copied: "Copiato"
            }
        };

        let currentLang = 'pt';

        function openEnvelope() {
            document.getElementById('envelope-screen').classList.add('opened');
            setTimeout(() => {
                document.getElementById('main-site').classList.add('visible');
            }, 400);
        }

        function setLang(lang) {
            currentLang = lang;
            const t = texts[lang];
            document.getElementById('txt-hint').innerText = t.hint;
            document.getElementById('txt-phrase').innerText = t.phrase;
            document.getElementById('txt-date').innerText = t.date;
            document.getElementById('txt-location').innerHTML = t.location;
            document.getElementById('txt-btn-site').innerText = t.btnSite;
            document.getElementById('txt-btn-gifts').innerText = t.btnGifts;
            document.getElementById('txt-iban-intro').innerText = t.ibanIntro;
            document.getElementById('txt-copy').innerText = t.copy;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });
        }

        function copyIBAN() {
            navigator.clipboard.writeText(document.getElementById('iban-code').innerText).then(() => {
                const btn = document.getElementById('txt-copy');
                btn.innerText = texts[currentLang].copied;
                setTimeout(() => btn.innerText = texts[currentLang].copy, 2000);
            });
        }
    </script>
</body>
</html>

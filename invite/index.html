<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Mariana & Filippo — Convite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            /* Novas Cores Elegantes */
            --gold-main: #D4AF37;      /* Dourado Clássico */
            --gold-light: #FDF6E3;     /* Creme / Dourado muito claro para textos */
            --dark-overlay: rgba(15, 15, 15, 0.55); /* Filtro escuro sobre a foto */
            --sage-green: #748B68;     /* Mantido apenas para o envelope se necessário */
            --bg-outside: #3A4432;     /* Fundo fora do convite */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-color: var(--bg-outside);
        }
        
        /* =========================================================
           1. ENVELOPE (Mantido igual)
           ========================================================= */

        #envelope-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
            background-color: transparent;
            overflow: hidden;
            transition: background-color 0.85s ease, opacity 0.35s ease, visibility 0.35s ease;
        }

        .env-corpo-img,
        .env-aba-img {
            position: absolute;
            width: 150%;
            height: 150%;
            left: -25%;
            top: -29.9%;
            object-fit: fill;
            pointer-events: none;
            user-select: none;
        }

        .env-corpo-img {
            z-index: 2;
            transform: translateY(0);
            transition: transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .env-aba-container {
            position: absolute;
            inset: 0;
            z-index: 4;
            transform: translateY(0);
            transition: transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .env-aba-img { z-index: 4; }

        .selo-img {
            position: absolute;
            left: 50%;
            top: 65%;
            width: clamp(180px, 22vw, 300px);
            height: auto;
            transform: translate(-50%, -50%) scale(1);
            z-index: 6;
            filter: drop-shadow(0 8px 14px rgba(0,0,0,0.42));
            transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .open-hint-text {
            position: absolute;
            left: 50%;
            bottom: 7%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.82);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            animation: pulse 2s infinite;
            transition: opacity 0.4s ease;
            z-index: 7;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #envelope-screen.opening { background-color: transparent; cursor: default; }
        #envelope-screen.opening .env-aba-container { transform: translateY(-110vh); }
        #envelope-screen.opening .env-corpo-img { transform: translateY(110vh); }
        #envelope-screen.opening .selo-img { opacity: 0; transform: translate(-50%, -50%) scale(0.65); }
        #envelope-screen.opening .open-hint-text { opacity: 0; }
        #envelope-screen.opened { opacity: 0; visibility: hidden; pointer-events: none; }

        /* =========================================================
           2. SITE PRINCIPAL
           ========================================================= */

        #main-site {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            background-image: url('background.jpg'); /* Fundo por fora do convite, mantido */
            background-size: cover;
            background-position: center bottom;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            opacity: 0;
            transform: scale(1);
            transition: opacity 0.35s ease;
        }

        #main-site.visible {
            opacity: 1;
        }

        /* =========================================================
           PAINEL CENTRAL (NOVO LOOK FOTOGRÁFICO)
           ========================================================= */

        .content-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 12px;
            border: 2px solid var(--gold-main); /* Borda Dourada Elegante */
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            overflow: hidden; /* Garante que a foto não sai dos cantos redondos */
            /* Altura mínima para ficar comprido e imponente */
            min-height: 85vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Slider de Fotos no Fundo */
        .card-bg-slider {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        .bg-photo {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .bg-photo.active { opacity: 1; }

        /* Filtro escuro para leitura do texto */
        .bg-overlay {
            position: absolute;
            inset: 0;
            background-color: var(--dark-overlay);
            z-index: 1;
        }

        /* Container do Texto que fica por cima da foto */
        .card-content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 70px 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================================
           IDIOMAS
           ========================================================= */

        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 45px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--gold-light);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0.5;
            padding-bottom: 4px;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            opacity: 1;
            border-bottom: 1px solid var(--gold-main);
            color: var(--gold-main);
        }

        /* =========================================================
           TÍTULOS E NOMES
           ========================================================= */

        .welcome-text {
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 15px;
        }

        .names-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }

        .names-title {
            position: relative;
            font-family: 'Allura', cursive;
            font-size: 82px;
            color: var(--gold-main);
            line-height: 1.1;
            text-align: center;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.3); /* Ligeira sombra para sobressair da foto */
        }

        .name-line { display: block; }

        .elegant-divider {
            border: none;
            border-bottom: 1px solid var(--gold-main);
            width: 50px;
            margin: 20px auto 35px auto;
            opacity: 0.7;
        }

        @media (min-width: 768px) {
            .names-title { font-size: 100px; }
        }

        /* =========================================================
           FRASE
           ========================================================= */

        .quote-phrase {
            font-size: 15px;
            font-weight: 300;
            color: var(--gold-light);
            line-height: 1.8;
            max-width: 480px;
            margin: 0 auto 60px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }

        /* =========================================================
           DATA, HORA E LOCALIZAÇÃO
           ========================================================= */

        .event-details {
            margin-bottom: 45px;
        }

        .date-text {
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--gold-main);
            margin-bottom: 8px;
            text-shadow: 1px 2px 5px rgba(0,0,0,0.3);
        }

        .time-text {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 3px;
            color: var(--gold-light);
            margin-bottom: 30px;
        }

        .location-info {
            font-size: 16px;
            font-weight: 300;
            line-height: 1.7;
            color: var(--gold-light);
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .location-info strong {
            font-weight: 500;
            color: var(--gold-main);
            letter-spacing: 1px;
            font-size: 17px;
        }

        /* =========================================================
           MAPA
           ========================================================= */

        .map-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
            color: var(--gold-main);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .map-link:hover {
            opacity: 0.7;
        }

        /* Ícone Mapa (SVG) */
        .map-icon {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =========================================================
           BOTÕES GHOST ELEGANTES (Nova alteração)
           ========================================================= */

        .buttons-group {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            width: 100%;
        }

        .action-btn {
            display: inline-block;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 16px 20px;
            border-radius: 4px; /* Cantos Ligeiramente arredondados (Retangular Elegante) */
            flex: 1 1 0;
            max-width: 200px;
            background-color: transparent; /* Efeito Ghost */
            border: 1px solid var(--gold-main); /* Borda Dourada */
            color: var(--gold-main); /* Texto Dourado */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: all 0.4s ease;
        }

        .action-btn:hover {
            background-color: var(--gold-main);
            color: #1A1A1A; /* Texto escuro ao passar o rato para alto contraste */
        }

        /* =========================================================
           IBAN
           ========================================================= */

        .iban-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-family: monospace;
            font-size: 15px;
            color: var(--gold-light);
            margin-top: 20px;
            padding-top: 30px;
            border-top: 1px solid rgba(212, 175, 55, 0.3); /* Linha divisória suave */
            width: 100%;
        }

        .copy-link {
            background: none;
            border: 1px solid var(--gold-main);
            border-radius: 4px;
            color: var(--gold-main);
            font-weight: 500;
            cursor: pointer;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 12px;
            transition: all 0.3s ease;
        }

        .copy-link:hover {
            background-color: var(--gold-main);
            color: #1A1A1A;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            #envelope-screen { background: #1a1e16; } /* Fundo mais escuro no carregamento mobile */
            .env-corpo-img { width: 150vw; height: 147.84dvh; max-width: none; max-height: none; left: -25vw; top: -29.2dvh; object-fit: fill; }
            .env-aba-container { overflow: hidden; }
            .env-aba-img { height: 120dvh; width: auto; max-width: none; max-height: none; left: 50%; top: -14.18dvh; transform: translateX(-50%); object-fit: contain; object-position: center top; }
            .selo-img { width: clamp(150px, 42vw, 195px); top: 65%; }

            #main-site { padding: 15px; }

            .content-wrapper {
                min-height: 90dvh; /* Ocupa quase todo o ecrã */
                border-width: 1px;
            }

            .card-content {
                padding: 60px 20px;
            }

            .lang-bar { margin-bottom: 35px; gap: 15px; }
            .welcome-text { font-size: 9px; letter-spacing: 4px; }
            .names-title { font-size: 64px; }
            .quote-phrase { font-size: 14px; margin-bottom: 45px; }
            .date-text { font-size: 28px; }
            .time-text { font-size: 14px; margin-bottom: 25px; }
            .location-info { font-size: 15px; }

            .buttons-group {
                flex-direction: column;
                gap: 12px;
                align-items: center;
            }

            .action-btn {
                width: 100%;
                max-width: 250px;
                flex: none;
                padding: 14px 20px;
            }

            .iban-container {
                font-size: 12px;
                flex-direction: column;
                gap: 10px;
                padding-top: 25px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================================
         1. ENVELOPE
         ========================================================= -->

    <div id="envelope-screen" onclick="openEnvelope()">
        <img src="envelope-corpo.png" alt="Corpo do Envelope" class="env-corpo-img">
        <div class="env-aba-container">
            <img src="envelope-aba.png" alt="Aba do Envelope" class="env-aba-img">
        </div>
        <img src="selo.png" alt="Selo de Cera" class="selo-img" onerror="this.style.display='none';">
        <p class="open-hint-text" id="txt-hint">Clique para abrir</p>
    </div>

    <!-- =========================================================
         2. CONVITE
         ========================================================= -->

    <div id="main-site">

        <div class="content-wrapper">
            
            <!-- SLIDER DE FOTOS NO FUNDO -->
            <div class="card-bg-slider">
                <!-- Adiciona aqui as vossas fotos. A class 'active' faz a primeira aparecer -->
                <img src="foto-praia-1.jpg" alt="Fundo Praia 1" class="bg-photo active" onerror="this.src='https://i.pinimg.com/236x/9b/7c/14/9b7c145e25c4265bbffc61648509b196.jpg'">
                <img src="foto-praia-2.jpg" alt="Fundo Praia 2" class="bg-photo" onerror="this.src='https://i.pinimg.com/564x/4b/32/38/4b32389176395b4588e30b65f3334ca0.jpg'">
                <img src="foto-praia-3.jpg" alt="Fundo Praia 3" class="bg-photo" onerror="this.src='https://i.pinimg.com/564x/87/4a/c7/874ac7d2dcf84a3c3e2eb887f54c30c3.jpg'">
                <!-- Overlay escuro -->
                <div class="bg-overlay"></div>
            </div>

            <!-- CONTEÚDO SOBRE A FOTO -->
            <div class="card-content">

                <div class="lang-bar">
                    <button class="lang-btn active" onclick="setLang('pt')" id="btn-pt">PT</button>
                    <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
                    <button class="lang-btn" onclick="setLang('it')" id="btn-it">IT</button>
                </div>

                <div class="welcome-text" id="txt-welcome">BEM-VINDOS AO CASAMENTO DE</div>
                
                <div class="names-wrapper">
                    <h1 class="names-title">
                        <span class="name-line">Mariana</span>
                        <span class="name-line">&amp; Filippo</span>
                    </h1>
                </div>

                <hr class="elegant-divider">

                <p class="quote-phrase" id="txt-phrase">
                    Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.
                </p>

                <div class="event-details">
                    <div class="date-text" id="txt-date">
                        07 . 08 . 2027
                    </div>
                    <!-- NOVA HORA -->
                    <div class="time-text" id="txt-time">
                        15:00
                    </div>

                    <div class="location-info" id="txt-location">
                        <strong>Ca' Salva</strong><br>Teolo, Itália
                    </div>

                    <a href="https://maps.app.goo.gl/WTEPBw1iE51htJrn6" target="_blank" rel="noopener noreferrer" class="map-link">
                        <!-- Ícone Mapa SVG -->
                        <svg class="map-icon" viewBox="0 0 24 24">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <span id="txt-map">Ver no mapa</span>
                    </a>
                </div>

                <div class="buttons-group">
                    <a href="https://marianafilippo.pt" target="_blank" rel="noopener noreferrer" class="action-btn" id="txt-btn-site">
                        Website
                    </a>

                    <a href="https://marianafilippo.pt/gifts" target="_blank" rel="noopener noreferrer" class="action-btn" id="txt-btn-gifts">
                        Presentes
                    </a>
                </div>

                <div class="iban-container">
                    <span id="iban-code">PT50003300004572499102105</span>
                    <button class="copy-link" onclick="copyIBAN()" id="txt-copy">Copiar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        const texts = {
            pt: {
                hint: "Clique para abrir",
                welcome: "BEM-VINDOS AO CASAMENTO DE",
                phrase: "Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.",
                date: "07 . 08 . 2027",
                location: "<strong>Ca' Salva</strong><br>Teolo, Itália",
                btnSite: "Website",
                btnGifts: "Presentes",
                map: "Ver no mapa",
                copy: "Copiar",
                copied: "Copiado"
            },
            en: {
                hint: "Click to open",
                welcome: "WELCOME TO THE WEDDING OF",
                phrase: "With endless joy, we invite you to celebrate our wedding day with us.",
                date: "07 . 08 . 2027",
                location: "<strong>Ca' Salva</strong><br>Teolo, Italy",
                btnSite: "Website",
                btnGifts: "Gift Registry",
                map: "View on map",
                copy: "Copy",
                copied: "Copied"
            },
            it: {
                hint: "Clicca per aprire",
                welcome: "BENVENUTI AL MATRIMONIO DI",
                phrase: "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",
                date: "07 . 08 . 2027",
                location: "<strong>Ca' Salva</strong><br>Teolo, Italia",
                btnSite: "Il nostro sito",
                btnGifts: "Lista Nozze",
                map: "Vedi sulla mappa",
                copy: "Copia",
                copied: "Copiato"
            }
        };

        let currentLang = 'pt';

        window.addEventListener('DOMContentLoaded', () => {
            const browserLang = (navigator.language || navigator.userLanguage).slice(0, 2).toLowerCase();
            const supportedLangs = ['pt', 'en', 'it'];
            if (supportedLangs.includes(browserLang)) {
                setLang(browserLang);
            } else {
                setLang('pt');
            }
            
            // Iniciar o novo slider de fotos de fundo
            startBackgroundSlider();
        });

        /* SLIDER DE FOTOS DE FUNDO */
        function startBackgroundSlider() {
            // A classe mudou para bg-photo para refletir a nova estrutura
            const photos = document.querySelectorAll('.bg-photo'); 
            let currentIndex = 0;
            
            if (photos.length > 1) {
                setInterval(() => {
                    photos[currentIndex].classList.remove('active');
                    currentIndex = (currentIndex + 1) % photos.length;
                    photos[currentIndex].classList.add('active');
                }, 4000); // Mudei para 4 segundos para a transição ser mais calma e chique
            }
        }

        function openEnvelope() {
            const screen = document.getElementById('envelope-screen');
            const mainSite = document.getElementById('main-site');

            if (screen.classList.contains('opening')) return;

            mainSite.classList.add('visible');
            screen.classList.add('opening');

            setTimeout(() => {
                screen.classList.add('opened');
            }, 1250);
        }

        function setLang(lang) {
            currentLang = lang;
            const t = texts[lang];

            document.getElementById('txt-hint').innerText = t.hint;
            document.getElementById('txt-welcome').innerText = t.welcome;
            document.getElementById('txt-phrase').innerText = t.phrase;
            document.getElementById('txt-date').innerText = t.date;
            document.getElementById('txt-location').innerHTML = t.location;
            document.getElementById('txt-btn-site').innerText = t.btnSite;
            document.getElementById('txt-btn-gifts').innerText = t.btnGifts;
            document.getElementById('txt-map').innerText = t.map;
            document.getElementById('txt-copy').innerText = t.copy;

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
        }

        function copyIBAN() {
            navigator.clipboard.writeText(document.getElementById('iban-code').innerText.trim())
                .then(() => {
                    const btn = document.getElementById('txt-copy');
                    btn.innerText = texts[currentLang].copied;
                    setTimeout(() => {
                        btn.innerText = texts[currentLang].copy;
                    }, 2000);
                });
        }

    </script>
</body>
</html>

<style>

    /* =========================================================
       VARIÁVEIS
       ========================================================= */

    :root {

        --sage-green: #748B68;
        --sage-dark: #5F7255;

        --cream: #FBF0D7;
        --cream-dark: #F7D586;

        --blue: #8FB8DE;

        --text-dark: #2C332A;
        --text-soft: #4A5247;

    }


    /* =========================================================
       RESET
       ========================================================= */

    * {

        box-sizing: border-box;

        margin: 0;
        padding: 0;

        -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

        width: 100%;
        min-height: 100%;
    }


    body {

        font-family: 'Montserrat', sans-serif;

        color: var(--text-dark);

        overflow-x: hidden;

        /*
         * O mesmo tom suave é usado como base da página.
         * Isto evita qualquer flash branco durante a abertura.
         */

        background-color: var(--cream);
    }



    /* =========================================================
       1. ENVELOPE
       ========================================================= */

    #envelope-screen {

        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        z-index: 9999;

        cursor: pointer;

        /*
         * O envelope começa totalmente opaco.
         * Ao abrir, fica transparente e revela diretamente
         * o convite que já está por baixo.
         */

        background-color: #fdfbf7;

        overflow: hidden;

        transition:
            background-color 0.75s ease,
            opacity 0.45s ease,
            visibility 0.45s ease;
    }



    /* =========================================================
       CORPO E ABA DO ENVELOPE
       ========================================================= */

    .env-corpo-img,
    .env-aba-img {

        position: absolute;

        width: 150%;
        height: 150%;

        left: -25%;
        top: -29.9%;

        object-fit: fill;

        pointer-events: none;

        user-select: none;
    }


    /*
     * CORPO
     */

    .env-corpo-img {

        z-index: 2;

        transform: translateY(0);

        transition:
            transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
    }


    /*
     * ABA
     */

    .env-aba-container {

        position: absolute;

        inset: 0;

        z-index: 4;

        transform: translateY(0);

        transition:
            transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
    }


    .env-aba-img {

        z-index: 4;
    }



    /* =========================================================
       SELO
       ========================================================= */

    .selo-img {

        position: absolute;

        left: 50%;
        top: 55%;

        width: clamp(160px, 20vw, 270px);

        height: auto;

        transform:
            translate(-50%, -50%)
            scale(1);

        z-index: 6;

        filter:
            drop-shadow(0 8px 14px rgba(0,0,0,0.42));

        transition:
            opacity 0.35s ease,
            transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
    }



    /* =========================================================
       TEXTO DO ENVELOPE
       ========================================================= */

    .open-hint-text {

        position: absolute;

        left: 50%;
        bottom: 7%;

        transform: translateX(-50%);

        color: rgba(255,255,255,0.82);

        font-size: 11px;

        letter-spacing: 4px;

        text-transform: uppercase;

        white-space: nowrap;

        animation: pulse 2s infinite;

        transition:
            opacity 0.3s ease;

        z-index: 7;
    }


    @keyframes pulse {

        0%,
        100% {
            opacity: 0.4;
        }

        50% {
            opacity: 1;
        }
    }



    /* =========================================================
       ABERTURA DO ENVELOPE
       ========================================================= */

    #envelope-screen.opening {

        /*
         * O fundo desaparece rapidamente.
         *
         * O site já está visível por baixo neste momento.
         */

        background-color: rgba(253, 251, 247, 0);

        cursor: default;
    }


    /*
     * ABA SOBE
     */

    #envelope-screen.opening .env-aba-container {

        transform: translateY(-110vh);
    }


    /*
     * CORPO DESCE
     */

    #envelope-screen.opening .env-corpo-img {

        transform: translateY(110vh);
    }


    /*
     * SELO DESAPARECE
     */

    #envelope-screen.opening .selo-img {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.65);
    }


    /*
     * TEXTO DESAPARECE
     */

    #envelope-screen.opening .open-hint-text {

        opacity: 0;
    }


    /*
     * No final retiramos o overlay.
     */

    #envelope-screen.opened {

        opacity: 0;

        visibility: hidden;

        pointer-events: none;
    }



    /* =========================================================
       2. SITE PRINCIPAL
       ========================================================= */

    #main-site {

        position: relative;

        width: 100vw;

        min-height: 100vh;

        /*
         * O background continua a ser a imagem original.
         */

        background-image: url('background.jpg');

        background-size: cover;

        background-position: center bottom;

        background-attachment: fixed;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 50px 20px;

        /*
         * IMPORTANTE:
         *
         * O site já existe e já está renderizado por baixo
         * do envelope.
         *
         * Apenas começa invisível.
         */

        opacity: 0;

        transform: scale(0.985);

        transition:
            opacity 0.65s ease,
            transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
    }


    /*
     * Durante a abertura o convite aparece rapidamente.
     */

    #main-site.visible {

        opacity: 1;

        transform: scale(1);
    }



    /* =========================================================
       CONTENT WRAPPER
       ========================================================= */

    .content-wrapper {

        width: 100%;

        max-width: 620px;

        margin: 0 auto;

        text-align: center;

        /*
         * NOVA COR CENTRAL
         *
         * Bege muito suave derivado de #FAE9C2.
         */

        background:
            rgba(251, 240, 215, 0.94);

        backdrop-filter: blur(8px);

        -webkit-backdrop-filter: blur(8px);

        padding: 55px 35px;

        border-radius: 18px;

        box-shadow:
            0 20px 50px rgba(0,0,0,0.13);

        border:
            1px solid rgba(255,255,255,0.72);
    }



    /* =========================================================
       IDIOMAS
       ========================================================= */

    .lang-bar {

        display: flex;

        justify-content: center;

        gap: 20px;

        margin-bottom: 35px;
    }


    .lang-btn {

        background: none;

        border: none;

        color: var(--sage-green);

        font-size: 12px;

        font-weight: 600;

        letter-spacing: 2px;

        cursor: pointer;

        opacity: 0.4;

        padding-bottom: 4px;

        transition:
            all 0.3s ease;
    }


    .lang-btn.active {

        opacity: 1;

        border-bottom:
            2px solid var(--sage-green);
    }



    /* =========================================================
       NOMES
       ========================================================= */

    .names-title {

        font-family: 'Allura', cursive;

        font-size: 68px;

        color: var(--sage-green);

        line-height: 1;

        margin-bottom: 20px;
    }


    @media (min-width: 768px) {

        .names-title {

            font-size: 86px;
        }
    }



    /* =========================================================
       FRASE
       ========================================================= */

    .quote-phrase {

        font-size: 14px;

        font-weight: 300;

        color: var(--text-soft);

        line-height: 1.8;

        margin-bottom: 42px;
    }



    /* =========================================================
       FOTOGRAFIA + MOLDURA
       ========================================================= */

    .photo-frame-wrapper {

        position: relative;

        /*
         * ANTES:
         * 260 x 350
         *
         * AGORA:
         * fotografia significativamente maior.
         */

        width: 360px;

        height: 480px;

        margin: 0 auto 48px;

        display: flex;

        justify-content: center;

        align-items: center;
    }


    /*
     * FOTOGRAFIA DOS NOIVOS
     */

    .couple-photo {

        position: absolute;

        /*
         * A fotografia ocupa quase toda a moldura.

        z-index: 1;

        box-shadow:
            0 12px 30px rgba(0,0,0,0.12);
    }


    /*
     * MOLDURA FLORAL
     *
     * A moldura aumenta proporcionalmente

    .floral-overlay-img {

        position: absolute;

    /* =========================================================

    .event-details {

    .date-text {

    .location-info {

    /* =========================================================
       BOTÕES
       ========================================================= */

    .buttons-group {

        display: flex;

        flex-direction: column;

        gap: 15px;

        margin-bottom: 35px;

        align-items: center;
    }


    .action-btn {

        display: inline-block;

        text-decoration: none;

        font-size: 11px;

        font-weight: 500;

        letter-spacing: 2px;

        padding: 16px 32px;

        border-radius: 30px;

        transition:
            all 0.3s ease;
    }


    .btn-site {

        background-color:

    }


    .btn-site:hover {

    .btn-gifts {

    /* =========================================================
       IBAN

    .iban-container {

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 10px;

        font-family: monospace;

        font-weight: 600;

        text-transform: uppercase;

        letter-spacing: 1px;

        transition:

    }


    .copy-link:hover {

        opacity: 0.7;
    }



    /* =========================================================
       MOBILE

    @media (max-width: 600px) {

        /*

        .env-corpo-img,

        /*

</style>

<script>


    /* =========================================================
       TEXTOS
       ========================================================= */

    const texts = {

        pt: {

            hint:
                "Clique para abrir",

            phrase:
                "Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.",

            date:
                "07 . 08 . 2027",

            location:
                "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portugal",

            btnSite:
                "O Nosso Site",

            btnGifts:
                "Lista de Presentes",

            copy:
                "Copiar",

            copied:
                "Copiado"
        },


        en: {

            hint:
                "Click to open",

            phrase:
                "With endless joy, we invite you to celebrate our wedding day with us.",

            date:
                "07 . 08 . 2027",

            location:
                "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portugal",

            btnSite:
                "Our Website",

            btnGifts:
                "Gift Registry",

            copy:
                "Copy",

            copied:
                "Copied"
        },


        it: {

            hint:
                "Clicca per aprire",

            phrase:
                "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",

            date:
                "07 . 08 . 2027",

            location:
                "<strong>Quinta dei Sogni</strong><br>Coimbra, Portogallo",

            btnSite:
                "Il Nostro Sito",

            btnGifts:
                "Lista Nozze",

            copy:
                "Copia",

            copied:
                "Copiato"
        }

    };


    let currentLang = 'pt';



    /* =========================================================
       IDIOMA AUTOMÁTICO
       ========================================================= */

    window.addEventListener(
        'DOMContentLoaded',
        () => {

            const browserLang =
                (
                    navigator.language ||
                    navigator.userLanguage
                )
                .slice(0, 2)
                .toLowerCase();


            const supportedLangs =
                ['pt', 'en', 'it'];


            if (
                supportedLangs.includes(browserLang)
            ) {

                setLang(browserLang);

            } else {

                setLang('pt');

            }

        }
    );



    /* =========================================================
       ABRIR ENVELOPE
       ========================================================= */

    function openEnvelope() {

        const screen =
            document.getElementById(
                'envelope-screen'
            );

        const mainSite =
            document.getElementById(
                'main-site'
            );


        /*
         * Evita cliques repetidos.
         */

        if (
            screen.classList.contains('opening')
        ) {

            return;
        }


        /*
         * =====================================================
         * PASSO 1
         * =====================================================
         *
         * O convite aparece imediatamente por baixo
         * do envelope.
         *
         * Como o envelope ainda está à frente,
         * o utilizador não vê um salto branco.
         */

        mainSite.classList.add('visible');


        /*
         * =====================================================
         * PASSO 2
         * =====================================================
         *
         * Começamos a abrir o envelope.
         *
         * O fundo do envelope torna-se transparente
         * enquanto a aba sobe e o corpo desce.
         */

        screen.classList.add('opening');


        /*
         * =====================================================
         * PASSO 3
         * =====================================================
         *
         * Retiramos completamente o envelope depois
         * de a animação terminar.
         */

        setTimeout(() => {

            screen.classList.add('opened');

        }, 1250);

    }



    /* =========================================================
       IDIOMAS
       ========================================================= */

    function setLang(lang) {

        currentLang = lang;

        const t = texts[lang];


        document
            .getElementById('txt-hint')
            .innerText =
            t.hint;


        document
            .getElementById('txt-phrase')
            .innerText =
            t.phrase;


        document
            .getElementById('txt-date')
            .innerText =
            t.date;


        document
            .getElementById('txt-location')
            .innerHTML =
            t.location;


        document
            .getElementById('txt-btn-site')
            .innerText =
            t.btnSite;


        document
            .getElementById('txt-btn-gifts')
            .innerText =
            t.btnGifts;


        document
            .getElementById('txt-copy')
            .innerText =
            t.copy;


        document
            .querySelectorAll('.lang-btn')
            .forEach(
                btn =>
                    btn.classList.remove('active')
            );


        document
            .getElementById(`btn-${lang}`)
            .classList.add('active');

    }



    /* =========================================================
       COPIAR IBAN
       ========================================================= */

    function copyIBAN() {

        navigator.clipboard
            .writeText(
                document
                    .getElementById('iban-code')
                    .innerText
            )
            .then(() => {

                const btn =
                    document
                        .getElementById(
                            'txt-copy'
                        );


                btn.innerText =
                    texts[currentLang].copied;


                setTimeout(() => {

                    btn.innerText =
                        texts[currentLang].copy;

                }, 2000);

            });

    }

</script>

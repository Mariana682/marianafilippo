<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Mariana & Filippo — Convite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --sage-green: #748B68;
            --text-dark: #2C332A;

            --cream: #FAE9C2;
            --gold: #F7D586;
            --blue: #8FB8DE;
            --sage: #748B68;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
            background-color: var(--cream);
        }


        /* =========================================================
           1. ENVELOPE
           ========================================================= */

        #envelope-screen {

            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 9999;

            cursor: pointer;

            background-color: transparent;

            overflow: hidden;

            transition:
                background-color 0.85s ease,
                opacity 0.35s ease,
                visibility 0.35s ease;
        }


        /*
         * DESKTOP
         *
         * Mantemos a configuração original.
         */

        .env-corpo-img,
        .env-aba-img {

            position: absolute;

            width: 150%;
            height: 150%;

            left: -25%;
            top: -29.9%;

            object-fit: fill;

            pointer-events: none;
            user-select: none;
        }


        /*
         * CORPO DO ENVELOPE
         */

        .env-corpo-img {

            z-index: 2;

            transform: translateY(0);

            transition:
                transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }


        /*
         * ABA DO ENVELOPE
         */

        .env-aba-container {

            position: absolute;

            inset: 0;

            z-index: 4;

            transform: translateY(0);

            transition:
                transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }


        .env-aba-img {
            z-index: 4;
        }


        /* =========================================================
           SELO
           ========================================================= */

        .selo-img {

            position: absolute;

            left: 50%;
            top: 55%;

            width: clamp(160px, 20vw, 270px);
            height: auto;

            transform:
                translate(-50%, -50%)
                scale(1);

            z-index: 6;

            filter:
                drop-shadow(0 8px 14px rgba(0,0,0,0.42));

            transition:
                opacity 0.45s ease,
                transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
        }


        /* =========================================================
           TEXTO DO ENVELOPE
           ========================================================= */

        .open-hint-text {

            position: absolute;

            left: 50%;
            bottom: 7%;

            transform: translateX(-50%);

            color: rgba(255,255,255,0.82);

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: uppercase;

            white-space: nowrap;

            animation: pulse 2s infinite;

            transition:
                opacity 0.4s ease;

            z-index: 7;
        }


        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }


        /* =========================================================
           ABERTURA
           ========================================================= */

        #envelope-screen.opening {

            background-color: transparent;

            cursor: default;
        }


        #envelope-screen.opening .env-aba-container {

            transform:
                translateY(-110vh);
        }


        #envelope-screen.opening .env-corpo-img {

            transform:
                translateY(110vh);
        }


        #envelope-screen.opening .selo-img {

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0.65);
        }


        #envelope-screen.opening .open-hint-text {

            opacity: 0;
        }


        #envelope-screen.opened {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        /* =========================================================
           2. SITE PRINCIPAL
           ========================================================= */

        #main-site {

            position: relative;

            width: 100vw;
            min-height: 100vh;

            background-image: url('background.jpg');

            background-size: cover;

            background-position: center bottom;

            background-attachment: fixed;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            opacity: 0;

            transform: scale(1);

            transition:
                opacity 0.35s ease;
        }


        #main-site.visible {

            opacity: 1;

            transform: scale(1);
        }


        /* =========================================================
           PAINEL CENTRAL
           ========================================================= */

        .content-wrapper {

            width: 100%;

            max-width: 680px;

            margin: 0 auto;

            text-align: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(250, 233, 194, 0.70),
                    rgba(250, 233, 194, 0.50)
                );

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

            padding: 55px 38px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.14);

            border:
                1px solid rgba(247, 213, 134, 0.65);
        }


        /* =========================================================
           IDIOMAS
           ========================================================= */

        .lang-bar {

            display: flex;

            justify-content: center;

            gap: 20px;

            margin-bottom: 35px;
        }


        .lang-btn {

            background: none;

            border: none;

            color: var(--sage-green);

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 2px;

            cursor: pointer;

            opacity: 0.4;

            padding-bottom: 4px;

            transition:
                all 0.3s ease;
        }


        .lang-btn.active {

            opacity: 1;

            border-bottom:
                2px solid var(--sage-green);
        }


        /* =========================================================
           NOMES
           ========================================================= */

        .names-title {

            font-family: 'Allura', cursive;

            font-size: 76px;

            color: var(--sage-green);

            line-height: 1;

            margin-bottom: 20px;

            text-align: center;
        }


        .name-line {
            display: block;
        }


        @media (min-width: 768px) {

            .names-title {
                font-size: 96px;
            }
        }


        /* =========================================================
           FRASE
           ========================================================= */

        .quote-phrase {

            font-family: 'Montserrat', sans-serif;

            font-size: 16px;

            font-weight: 400;

            color: var(--sage-green);

            line-height: 1.7;

            text-align: center;

            max-width: 540px;

            margin:
                0 auto 45px;
        }


        /* =========================================================
           FOTO
           ========================================================= */

        .photo-frame-wrapper {

            position: relative;

            width: min(390px, 82vw);

            aspect-ratio: 0.75 / 1;

            height: auto;

            margin:
                0 auto 50px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .couple-photo {

            position: absolute;

            width: 92%;
            height: 92%;

            object-fit: cover;

            border-radius:
                150px 150px 14px 14px;

            z-index: 1;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.1);
        }


        .floral-overlay-img {

            position: absolute;

            top: -4%;
            left: -4%;

            width: 108%;
            height: 108%;

            object-fit: contain;

            z-index: 2;

            pointer-events: none;
        }


        /* =========================================================
           DATA E LOCALIZAÇÃO
           ========================================================= */

        .event-details {

            margin-bottom: 35px;
        }


        .date-text {

            font-size: 32px;

            font-weight: 700;

            letter-spacing: 3px;

            color: var(--sage-green);

            text-transform: uppercase;

            margin-bottom: 15px;
        }


        .location-info {

            font-size: 14px;

            font-weight: 300;

            line-height: 1.7;

            color: #3b4239;

            margin-bottom: 25px;
        }


        .location-info strong {

            font-weight: 600;
        }


        /* =========================================================
           MAPA
           ========================================================= */

        .map-link {

            display: inline-block;

            margin-top: -12px;

            margin-bottom: 30px;

            color: var(--sage-green);

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 1.6px;

            text-transform: uppercase;

            text-decoration: none;

            border-bottom:
                1px solid rgba(116, 139, 104, 0.45);

            padding-bottom: 3px;

            transition:
                opacity 0.2s ease;
        }


        .map-link:hover {

            opacity: 0.65;
        }


        /* =========================================================
           BOTÕES
           ========================================================= */

        .buttons-group {

            display: flex;

            flex-direction: row;

            justify-content: center;

            gap: 15px;

            margin-bottom: 35px;

            align-items: center;
        }


        .action-btn {

            display: inline-block;

            text-decoration: none;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 2px;

            text-transform: uppercase;

            padding: 16px 32px;

            border-radius: 30px;

            width: auto;

            flex: 1 1 0;

            max-width: 280px;

            transition:
                all 0.3s ease;
        }


        .btn-site {

            background-color:
                var(--sage);

            color: #ffffff;
        }


        .btn-gifts {

            background-color:
                var(--gold);

            color: #4a3a0f;
        }


        /* =========================================================
           IBAN
           ========================================================= */

        .iban-container {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            font-family: monospace;

            font-size: 10px;

            color: var(--text-dark);

            margin-top: 10px;

            padding-top: 20px;

            border-top:
                1px solid rgba(116, 139, 104, 0.22);
        }


        .copy-link {

            background: none;

            border: none;

            color: var(--sage-green);

            font-weight: 600;

            cursor: pointer;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 0.8px;

            padding: 2px 6px;

            transition:
                opacity 0.2s ease;
        }


        .copy-link:hover {

            opacity: 0.7;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            /*
             * ENVELOPE
             *
             * Aqui a ALTURA é que define o tamanho.
             *
             * A largura fica AUTO e é calculada
             * proporcionalmente pela imagem original.
             *
             * NÃO existe scale().
             */

            #envelope-screen {

                position: fixed;

                inset: 0;

                width: 100vw;

                height: 100dvh;

                min-height: 100svh;

                max-height: none;

                overflow: hidden;
            }


        .env-corpo-img,
.env-aba-img {
    position: absolute;

    /*
     * Aumentamos a imagem com base na altura do telefone.
     * A largura continua automática para preservar a proporção.
     */
    height: 125dvh;
    width: auto;

    max-width: none;
    max-height: none;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    object-fit: contain;
    object-position: center center;
}


            /*
             * CORPO NO MOBILE
             *
             * Mantém o mesmo centro quando fechado.
             */

            .env-corpo-img {

                z-index: 2;

                transition:
                    transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
            }


            /*
             * ABA NO MOBILE
             */

            .env-aba-container {

                position: absolute;

                inset: 0;

                z-index: 4;

                transform: translateY(0);

                transition:
                    transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
            }


            .env-aba-img {

                z-index: 4;
            }


            /*
             * Quando abre no telefone,
             * o corpo mantém o seu centro horizontal
             * e desloca-se apenas para baixo.
             */

            #envelope-screen.opening .env-corpo-img {

                transform:
                    translate(-50%, -50%)
                    translateY(110vh);
            }


            /*
             * Selo no telefone.
             */

            .selo-img {

                width: clamp(130px, 38vw, 180px);

                top: 55%;
            }


            .open-hint-text {

                bottom: 5%;

                font-size: 9px;

                letter-spacing: 3px;
            }


            /* =========================================
               SITE NO TELEFONE
               ========================================= */

            #main-site {

                min-height: 100dvh;

                padding:
                    20px 12px;

                background-attachment: scroll;

                align-items: center;
            }


            .content-wrapper {

                width: 100%;

                max-width: 100%;

                padding:
                    42px 20px;

                border-radius: 18px;

                background:
                    rgba(250, 233, 194, 0.50);

                backdrop-filter: blur(7px);

                -webkit-backdrop-filter: blur(7px);

                border:
                    1px solid rgba(255,255,255,0.45);

                box-shadow:
                    0 15px 40px rgba(0,0,0,0.12);
            }


            .lang-bar {

                margin-bottom: 28px;

                gap: 18px;
            }


            .names-title {

                font-size:
                    clamp(58px, 17vw, 76px);

                margin-bottom: 18px;
            }


            .quote-phrase {

                font-size: 15px;

                line-height: 1.65;

                margin-bottom: 35px;
            }


            .photo-frame-wrapper {

                width:
                    min(360px, 88vw);

                margin-bottom: 45px;
            }


            .couple-photo {

                width: 92%;
                height: 92%;
            }


            .floral-overlay-img {

                width: 108%;
                height: 108%;
            }


            .date-text {

                font-size: 29px;

                font-weight: 700;

                letter-spacing: 2.5px;

                margin-bottom: 13px;
            }


            .location-info {

                font-size: 13px;

                line-height: 1.7;
            }


            .map-link {

                font-size: 9px;

                margin-bottom: 28px;
            }


            .buttons-group {

                flex-direction: column;

                gap: 12px;
            }


            .action-btn {

                width: 100%;

                max-width: 280px;

                flex: none;
            }


            .iban-container {

                font-size: 9px;

                gap: 7px;

                overflow: hidden;
            }


            .copy-link {

                font-size: 8px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================================
         1. ENVELOPE
         ========================================================= -->

    <div
        id="envelope-screen"
        onclick="openEnvelope()"
    >

        <img
            src="envelope-corpo.png"
            alt="Corpo do Envelope"
            class="env-corpo-img"
        >


        <div class="env-aba-container">

            <img
                src="envelope-aba.png"
                alt="Aba do Envelope"
                class="env-aba-img"
            >

        </div>


        <img
            src="selo.png"
            alt="Selo de Cera"
            class="selo-img"
            onerror="this.style.display='none';"
        >


        <p
            class="open-hint-text"
            id="txt-hint"
        >
            Clique para abrir
        </p>

    </div>


    <!-- =========================================================
         2. CONVITE
         ========================================================= -->

    <div id="main-site">

        <div class="content-wrapper">


            <div class="lang-bar">

                <button
                    class="lang-btn"
                    onclick="setLang('pt')"
                    id="btn-pt"
                >
                    PT
                </button>

                <button
                    class="lang-btn"
                    onclick="setLang('en')"
                    id="btn-en"
                >
                    EN
                </button>

                <button
                    class="lang-btn"
                    onclick="setLang('it')"
                    id="btn-it"
                >
                    IT
                </button>

            </div>


            <h1 class="names-title">

                <span class="name-line">
                    Mariana
                </span>

                <span class="name-line">
                    &amp; Filippo
                </span>

            </h1>


            <p
                class="quote-phrase"
                id="txt-phrase"
            >
                Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.
            </p>


            <div class="photo-frame-wrapper">

                <img
                    src="foto-noivos.jpg"
                    alt="Mariana & Filippo"
                    class="couple-photo"
                    onerror="this.src='https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=400&q=80'"
                >


                <img
                    src="moldura.png"
                    alt="Moldura Floral"
                    class="floral-overlay-img"
                    onerror="this.style.display='none';"
                >

            </div>


            <div class="event-details">


                <div
                    class="date-text"
                    id="txt-date"
                >
                    07 . 08 . 2027
                </div>


                <div
                    class="location-info"
                    id="txt-location"
                >
                    <strong>Ca' Salva</strong><br>
                    Teolo, Itália
                </div>


                <a
                    href="https://www.google.com/maps/search/?api=1&query=Ca%27+Salva%2C+Teolo%2C+Italy"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="map-link"
                    id="txt-map"
                >
                    Ver no mapa
                </a>


            </div>


            <div class="buttons-group">


                <a
                    href="https://marianafilippo.pt"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action-btn btn-site"
                    id="txt-btn-site"
                >
                    Website
                </a>


                <a
                    href="https://marianafilippo.pt/gifts"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action-btn btn-gifts"
                    id="txt-btn-gifts"
                >
                    Presentes
                </a>


            </div>


            <div class="iban-container">

                <span id="iban-code">
                    PT50003300004572499102105
                </span>


                <button
                    class="copy-link"
                    onclick="copyIBAN()"
                    id="txt-copy"
                >
                    Copiar
                </button>

            </div>


        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        const texts = {

            pt: {

                hint:
                    "Clique para abrir",

                phrase:
                    "Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Itália",

                btnSite:
                    "Website",

                btnGifts:
                    "Presentes",

                map:
                    "Ver no mapa",

                copy:
                    "Copiar",

                copied:
                    "Copiado"
            },


            en: {

                hint:
                    "Click to open",

                phrase:
                    "With endless joy, we invite you to celebrate our wedding day with us.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Italy",

                btnSite:
                    "Website",

                btnGifts:
                    "Gift Registry",

                map:
                    "View on map",

                copy:
                    "Copy",

                copied:
                    "Copied"
            },


            it: {

                hint:
                    "Clicca per aprire",

                phrase:
                    "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Italia",

                btnSite:
                    "Il nostro sito",

                btnGifts:
                    "Lista Nozze",

                map:
                    "Vedi sulla mappa",

                copy:
                    "Copia",

                copied:
                    "Copiato"
            }

        };


        let currentLang = 'pt';


        /* =========================================================
           IDIOMA AUTOMÁTICO
           ========================================================= */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                const browserLang =
                    (
                        navigator.language ||
                        navigator.userLanguage
                    )
                    .slice(0, 2)
                    .toLowerCase();


                const supportedLangs =
                    ['pt', 'en', 'it'];


                if (
                    supportedLangs.includes(browserLang)
                ) {

                    setLang(browserLang);

                } else {

                    setLang('pt');

                }

            }
        );


        /* =========================================================
           ABRIR ENVELOPE
           ========================================================= */

        function openEnvelope() {

            const screen =
                document.getElementById(
                    'envelope-screen'
                );


            const mainSite =
                document.getElementById(
                    'main-site'
                );


            if (
                screen.classList.contains('opening')
            ) {

                return;
            }


            mainSite.classList.add('visible');


            screen.classList.add('opening');


            setTimeout(() => {

                screen.classList.add('opened');

            }, 1250);

        }


        /* =========================================================
           IDIOMAS
           ========================================================= */

        function setLang(lang) {

            currentLang = lang;

            const t = texts[lang];


            document
                .getElementById('txt-hint')
                .innerText =
                t.hint;


            document
                .getElementById('txt-phrase')
                .innerText =
                t.phrase;


            document
                .getElementById('txt-date')
                .innerText =
                t.date;


            document
                .getElementById('txt-location')
                .innerHTML =
                t.location;


            document
                .getElementById('txt-btn-site')
                .innerText =
                t.btnSite;


            document
                .getElementById('txt-btn-gifts')
                .innerText =
                t.btnGifts;


            document
                .getElementById('txt-map')
                .innerText =
                t.map;


            document
                .getElementById('txt-copy')
                .innerText =
                t.copy;


            document
                .querySelectorAll('.lang-btn')
                .forEach(
                    btn =>
                        btn.classList.remove('active')
                );


            document
                .getElementById(`btn-${lang}`)
                .classList.add('active');

        }


        /* =========================================================
           COPIAR IBAN
           ========================================================= */

        function copyIBAN() {

            navigator.clipboard
                .writeText(
                    document
                        .getElementById('iban-code')
                        .innerText
                )
                .then(() => {

                    const btn =
                        document
                            .getElementById(
                                'txt-copy'
                            );


                    btn.innerText =
                        texts[currentLang].copied;


                    setTimeout(() => {

                        btn.innerText =
                            texts[currentLang].copy;

                    }, 2000);

                });

        }

    </script>

</body>
</html>

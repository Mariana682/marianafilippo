<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariana & Filippo — Convite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        :root {
            --sage-green: #6a7b5e;
            --text-dark: #2C332A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
            background-color: #fdfbf7;
        }


        /* =========================================================
           1. ENVELOPE
           ========================================================= */

        #envelope-screen {

            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 9999;

            cursor: pointer;

            /*
             * Começamos com branco.
             * Durante a abertura torna-se transparente para que
             * o convite apareça por baixo.
             */
            background-color: #fdfbf7;

            overflow: hidden;

            transition:
                background-color 1.15s ease,
                opacity 0.35s ease,
                visibility 0.35s ease;
        }


        /*
         * ========================================================
         * CORPO E ABA
         * ========================================================
         *
         * As duas imagens continuam exatamente sobrepostas.
         *
         * Não existe qualquer rotação 3D.
         *
         * A abertura é feita simplesmente separando as duas
         * partes verticalmente.
         */

        .env-corpo-img,
        .env-aba-img {

            position: absolute;

            width: 150%;
            height: 150%;

            left: -25%;
            top: -29.9%;

            object-fit: fill;

            pointer-events: none;
            user-select: none;
        }


        /*
         * CORPO DO ENVELOPE
         */

        .env-corpo-img {

            z-index: 2;

            /*
             * Movimento para baixo durante a abertura.
             */
            transform: translateY(0);

            transition:
                transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }


        /*
         * ABA DO ENVELOPE
         */

        .env-aba-container {

            position: absolute;

            inset: 0;

            z-index: 4;

            /*
             * SEM rotateX.
             *
             * A aba simplesmente sobe.
             */
            transform: translateY(0);

            transition:
                transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }


        .env-aba-img {

            z-index: 4;
        }


        /*
         * ========================================================
         * SELO
         * ========================================================
         */

        .selo-img {

            position: absolute;

            left: 50%;

            /*
             * Mais abaixo do que anteriormente.
             */
            top: 55%;

            /*
             * Selo bastante maior.
             */
            width: clamp(160px, 20vw, 270px);

            height: auto;

            transform:
                translate(-50%, -50%)
                scale(1);

            z-index: 6;

            filter:
                drop-shadow(0 8px 14px rgba(0,0,0,0.42));

            transition:
                opacity 0.45s ease,
                transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
        }


        /*
         * ========================================================
         * TEXTO "CLIQUE PARA ABRIR"
         * ========================================================
         */

        .open-hint-text {

            position: absolute;

            left: 50%;
            bottom: 7%;

            transform: translateX(-50%);

            color: rgba(255,255,255,0.82);

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: uppercase;

            white-space: nowrap;

            animation: pulse 2s infinite;

            transition:
                opacity 0.4s ease;

            z-index: 7;
        }


        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }



        /* =========================================================
           ABERTURA
           ========================================================= */


        /*
         * O FUNDO DO ENVELOPE torna-se transparente.
         *
         * Isto é importante:
         * o convite já está a aparecer por baixo enquanto
         * as peças do envelope se afastam.
         */

        #envelope-screen.opening {

            background-color: rgba(253, 251, 247, 0);

            cursor: default;
        }


        /*
         * ABA:
         *
         * desliza completamente para cima.
         *
         * Não roda.
         */

        #envelope-screen.opening .env-aba-container {

            transform:
                translateY(-110vh);
        }


        /*
         * CORPO:
         *
         * desliza completamente para baixo.
         */

        #envelope-screen.opening .env-corpo-img {

            transform:
                translateY(110vh);
        }


        /*
         * SELO:
         *
         * desaparece antes de as duas partes
         * se afastarem completamente.
         */

        #envelope-screen.opening .selo-img {

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0.65);
        }


        /*
         * TEXTO desaparece.
         */

        #envelope-screen.opening .open-hint-text {

            opacity: 0;
        }


        /*
         * No final já não precisamos do overlay.
         */

        #envelope-screen.opened {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }



        /* =========================================================
           2. SITE PRINCIPAL
           ========================================================= */

        #main-site {

            position: relative;

            width: 100vw;
            min-height: 100vh;

            background-image: url('background.jpg');

            background-size: cover;

            background-position: center bottom;

            background-attachment: fixed;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            /*
             * Começa escondido.
             */

            opacity: 0;

            transform: scale(0.985);

            transition:
                opacity 1.35s ease,
                transform 1.5s cubic-bezier(0.22, 0.61, 0.36, 1);
        }


        /*
         * O convite começa a aparecer assim que clicamos
         * no envelope.
         */

        #main-site.visible {

            opacity: 1;

            transform: scale(1);
        }


        .content-wrapper {

            width: 100%;

            max-width: 580px;

            margin: 0 auto;

            text-align: center;

            background:
                rgba(253, 251, 247, 0.92);

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

            padding: 50px 30px;

            border-radius: 16px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.15);

            border:
                1px solid rgba(255,255,255,0.7);
        }


        .lang-bar {

            display: flex;

            justify-content: center;

            gap: 20px;

            margin-bottom: 35px;
        }


        .lang-btn {

            background: none;

            border: none;

            color: var(--sage-green);

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 2px;

            cursor: pointer;

            opacity: 0.4;

            padding-bottom: 4px;

            transition:
                all 0.3s ease;
        }


        .lang-btn.active {

            opacity: 1;

            border-bottom:
                2px solid var(--sage-green);
        }


        .names-title {

            font-family: 'Allura', cursive;

            font-size: 68px;

            color: var(--sage-green);

            line-height: 1;

            margin-bottom: 20px;
        }


        @media (min-width: 768px) {

            .names-title {
                font-size: 86px;
            }
        }


        .quote-phrase {

            font-size: 14px;

            font-weight: 300;

            color: #4a5247;

            line-height: 1.8;

            margin-bottom: 45px;
        }


        .photo-frame-wrapper {

            position: relative;

            width: 260px;

            height: 350px;

            margin: 0 auto 45px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .couple-photo {

            position: absolute;

            width: 85%;
            height: 85%;

            object-fit: cover;

            border-radius:
                120px 120px 10px 10px;

            z-index: 1;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.1);
        }


        .floral-overlay-img {

            position: absolute;

            top: -5%;
            left: -5%;

            width: 110%;
            height: 110%;

            object-fit: contain;

            z-index: 2;

            pointer-events: none;
        }


        .event-details {

            margin-bottom: 35px;
        }


        .date-text {

            font-size: 18px;

            font-weight: 500;

            letter-spacing: 3px;

            color: var(--sage-green);

            text-transform: uppercase;

            margin-bottom: 15px;
        }


        .location-info {

            font-size: 14px;

            font-weight: 300;

            line-height: 1.7;

            color: #3b4239;

            margin-bottom: 25px;
        }


        .buttons-group {

            display: flex;

            flex-direction: column;

            gap: 15px;

            margin-bottom: 35px;

            align-items: center;
        }


        .action-btn {

            display: inline-block;

            text-decoration: none;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 2px;

            text-transform: uppercase;

            padding: 16px 32px;

            border-radius: 30px;

            width: 100%;

            max-width: 280px;

            transition:
                all 0.3s ease;
        }


        .btn-site {

            background-color:
                var(--sage-green);

            color: #ffffff;
        }


        .btn-gifts {

            background-color:
                #E8D8B0;

            color: #4a3a0f;
        }


        .iban-container {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            font-family: monospace;

            font-size: 12px;

            color: var(--text-dark);

            margin-top: 10px;

            padding-top: 20px;

            border-top:
                1px solid rgba(106, 123, 94, 0.15);
        }


        .copy-link {

            background: none;

            border: none;

            color: var(--sage-green);

            font-weight: 600;

            cursor: pointer;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;

            padding: 2px 6px;

            transition:
                opacity 0.2s ease;
        }


        .copy-link:hover {

            opacity: 0.7;
        }



        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            .env-corpo-img,
            .env-aba-img {

                width: 185%;
                height: 185%;

                left: -42.5%;
                top: -37%;
            }


            .selo-img {

                width:
                    clamp(140px, 30vw, 195px);

                top: 55%;
            }


            .open-hint-text {

                bottom: 5%;

                font-size: 9px;

                letter-spacing: 3px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================================================
         1. ENVELOPE
         ========================================================= -->

    <div
        id="envelope-screen"
        onclick="openEnvelope()"
    >

        <!-- Corpo do envelope -->

        <img
            src="envelope-corpo.png"
            alt="Corpo do Envelope"
            class="env-corpo-img"
        >


        <!-- Aba superior -->

        <div class="env-aba-container">

            <img
                src="envelope-aba.png"
                alt="Aba do Envelope"
                class="env-aba-img"
            >

        </div>


        <!-- Selo -->

        <img
            src="selo.png"
            alt="Selo de Cera"
            class="selo-img"
            onerror="this.style.display='none';"
        >


        <!-- Texto -->

        <p
            class="open-hint-text"
            id="txt-hint"
        >
            Clique para abrir
        </p>

    </div>



    <!-- =========================================================
         2. CONVITE
         ========================================================= -->

    <div id="main-site">

        <div class="content-wrapper">


            <div class="lang-bar">

                <button
                    class="lang-btn"
                    onclick="setLang('pt')"
                    id="btn-pt"
                >
                    PT
                </button>

                <button
                    class="lang-btn"
                    onclick="setLang('en')"
                    id="btn-en"
                >
                    EN
                </button>

                <button
                    class="lang-btn"
                    onclick="setLang('it')"
                    id="btn-it"
                >
                    IT
                </button>

            </div>


            <h1 class="names-title">
                Mariana & Filippo
            </h1>


            <p
                class="quote-phrase"
                id="txt-phrase"
            >
                Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.
            </p>


            <div class="photo-frame-wrapper">

                <img
                    src="foto-noivos.jpg"
                    alt="Mariana & Filippo"
                    class="couple-photo"
                    onerror="this.src='https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=400&q=80'"
                >

                <img
                    src="moldura.png"
                    alt="Moldura Floral"
                    class="floral-overlay-img"
                    onerror="this.style.display='none';"
                >

            </div>


            <div class="event-details">

                <div
                    class="date-text"
                    id="txt-date"
                >
                    07 . 08 . 2027
                </div>


                <div
                    class="location-info"
                    id="txt-location"
                >
                    <strong>Quinta dos Sonhos</strong><br>
                    Coimbra, Portugal
                </div>

            </div>


            <div class="buttons-group">

                <a
                    href="https://marianafilippo.pt"
                    target="_blank"
                    class="action-btn btn-site"
                    id="txt-btn-site"
                >
                    O Nosso Site
                </a>


                <a
                    href="https://marianafilippo.pt/#presentes"
                    target="_blank"
                    class="action-btn btn-gifts"
                    id="txt-btn-gifts"
                >
                    Lista de Presentes
                </a>

            </div>


            <div class="iban-container">

                <span id="iban-code">
                    PT50 0000 0000 0000 0000 0000 0
                </span>

                <button
                    class="copy-link"
                    onclick="copyIBAN()"
                    id="txt-copy"
                >
                    Copiar
                </button>

            </div>


        </div>

    </div>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>


        const texts = {

            pt: {

                hint:
                    "Clique para abrir",

                phrase:
                    "Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portugal",

                btnSite:
                    "O Nosso Site",

                btnGifts:
                    "Lista de Presentes",

                copy:
                    "Copiar",

                copied:
                    "Copiado"
            },


            en: {

                hint:
                    "Click to open",

                phrase:
                    "With endless joy, we invite you to celebrate our wedding day with us.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portugal",

                btnSite:
                    "Our Website",

                btnGifts:
                    "Gift Registry",

                copy:
                    "Copy",

                copied:
                    "Copied"
            },


            it: {

                hint:
                    "Clicca per aprire",

                phrase:
                    "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Quinta dei Sogni</strong><br>Coimbra, Portogallo",

                btnSite:
                    "Il Nostro Sito",

                btnGifts:
                    "Lista Nozze",

                copy:
                    "Copia",

                copied:
                    "Copiato"
            }

        };


        let currentLang = 'pt';


        /* =========================================================
           IDIOMA AUTOMÁTICO
           ========================================================= */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                const browserLang =
                    (
                        navigator.language ||
                        navigator.userLanguage
                    )
                    .slice(0, 2)
                    .toLowerCase();


                const supportedLangs =
                    ['pt', 'en', 'it'];


                if (
                    supportedLangs.includes(browserLang)
                ) {

                    setLang(browserLang);

                } else {

                    setLang('pt');

                }

            }
        );



        /* =========================================================
           ABRIR ENVELOPE
           ========================================================= */

        function openEnvelope() {

            const screen =
                document.getElementById(
                    'envelope-screen'
                );

            const mainSite =
                document.getElementById(
                    'main-site'
                );


            /*
             * Impede cliques repetidos.
             */

            if (
                screen.classList.contains('opening')
            ) {

                return;
            }


            /*
             * PRIMEIRO:
             * começa imediatamente a revelar o site
             * por trás do envelope.
             */

            mainSite.classList.add('visible');


            /*
             * Depois começa a separação do envelope.
             */

            screen.classList.add('opening');


            /*
             * Quando a animação terminou,
             * retiramos completamente o envelope.
             */

            setTimeout(() => {

                screen.classList.add('opened');

            }, 1250);

        }



        /* =========================================================
           IDIOMAS
           ========================================================= */

        function setLang(lang) {

            currentLang = lang;

            const t = texts[lang];


            document
                .getElementById('txt-hint')
                .innerText =
                t.hint;


            document
                .getElementById('txt-phrase')
                .innerText =
                t.phrase;


            document
                .getElementById('txt-date')
                .innerText =
                t.date;


            document
                .getElementById('txt-location')
                .innerHTML =
                t.location;


            document
                .getElementById('txt-btn-site')
                .innerText =
                t.btnSite;


            document
                .getElementById('txt-btn-gifts')
                .innerText =
                t.btnGifts;


            document
                .getElementById('txt-copy')
                .innerText =
                t.copy;


            document
                .querySelectorAll('.lang-btn')
                .forEach(
                    btn =>
                        btn.classList.remove('active')
                );


            document
                .getElementById(`btn-${lang}`)
                .classList.add('active');

        }



        /* =========================================================
           COPIAR IBAN
           ========================================================= */

        function copyIBAN() {

            navigator.clipboard
                .writeText(
                    document
                        .getElementById('iban-code')
                        .innerText
                )
                .then(() => {

                    const btn =
                        document
                            .getElementById(
                                'txt-copy'
                            );


                    btn.innerText =
                        texts[currentLang].copied;


                    setTimeout(() => {

                        btn.innerText =
                            texts[currentLang].copy;

                    }, 2000);

                });

        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Mariana & Filippo — Convite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           CORES
           ========================================================= */

        :root {
            --sage-green: #748B68;
            --text-dark: #2C332A;
            --cream: #FAE9C2;
            --gold: #F7D586;
            --blue: #8FB8DE;
        }


        /* =========================================================
           RESET
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            min-height: 100%;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
            background: #FAE9C2;
        }


        /* =========================================================
           ENVELOPE
           ========================================================= */

        #envelope-screen {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            z-index: 9999;
            cursor: pointer;

            background: #fdfbf7;

            overflow: hidden;

            transition:
                background-color 1.15s ease,
                opacity 0.35s ease,
                visibility 0.35s ease;
        }


        /*
         * As imagens mantêm sempre a proporção.
         *
         * Em vez de alterar width e height independentemente,
         * usamos object-fit: cover.
         */

        .env-corpo-img,
        .env-aba-img {
            position: absolute;

            width: 150vw;
            height: 150vh;

            max-width: none;
            max-height: none;

            left: 50%;
            top: 50%;

            object-fit: cover;
            object-position: center center;

            pointer-events: none;
            user-select: none;
        }


        /* =========================================================
           CORPO
           ========================================================= */

        .env-corpo-img {
            z-index: 2;

            transform:
                translate(-50%, -50%);

            transition:
                transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }


        /* =========================================================
           ABA
           ========================================================= */

        .env-aba-container {
            position: absolute;
            inset: 0;

            z-index: 4;

            overflow: visible;

            transform:
                translateY(0);

            transition:
                transform 1.15s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .env-aba-img {
            z-index: 4;

            transform:
                translate(-50%, -50%);
        }


        /* =========================================================
           SELO
           ========================================================= */

        .selo-img {
            position: absolute;

            left: 50%;
            top: 55%;

            width: clamp(
                160px,
                20vw,
                270px
            );

            height: auto;

            transform:
                translate(-50%, -50%)
                scale(1);

            z-index: 6;

            filter:
                drop-shadow(
                    0 8px 14px rgba(0,0,0,0.42)
                );

            transition:
                opacity 0.45s ease,
                transform 0.55s
                cubic-bezier(
                    0.22,
                    0.61,
                    0.36,
                    1
                );
        }


        /* =========================================================
           TEXTO DO ENVELOPE
           ========================================================= */

        .open-hint-text {
            position: absolute;

            left: 50%;
            bottom: 7%;

            transform:
                translateX(-50%);

            color:
                rgba(255,255,255,0.82);

            font-size: 11px;
            letter-spacing: 4px;

            text-transform: uppercase;

            white-space: nowrap;

            animation:
                pulse 2s infinite;

            transition:
                opacity 0.4s ease;

            z-index: 7;
        }


        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }


        /* =========================================================
           ABERTURA
           ========================================================= */

        #envelope-screen.opening {
            background-color:
                rgba(253,251,247,0);

            cursor: default;
        }


        #envelope-screen.opening
        .env-aba-container {

            transform:
                translateY(-110vh);
        }


        #envelope-screen.opening
        .env-corpo-img {

            transform:
                translate(-50%, -50%)
                translateY(110vh);
        }


        #envelope-screen.opening
        .selo-img {

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0.65);
        }


        #envelope-screen.opening
        .open-hint-text {

            opacity: 0;
        }


        #envelope-screen.opened {

            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* =========================================================
           SITE PRINCIPAL
           ========================================================= */

        #main-site {

            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            background-image:
                url('background.jpg');

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            display: flex;

            justify-content: center;
            align-items: center;

            padding:
                50px 25px;

            opacity: 0;

            transform:
                scale(0.985);

            transition:
                opacity 1.35s ease,
                transform 1.5s
                cubic-bezier(
                    0.22,
                    0.61,
                    0.36,
                    1
                );
        }


        #main-site.visible {

            opacity: 1;

            transform:
                scale(1);
        }


        /* =========================================================
           PAINEL CENTRAL
           ========================================================= */

        .content-wrapper {

            position: relative;

            width: 100%;
            max-width: 600px;

            margin: 0 auto;

            text-align: center;

            /*
             * Mais transparente:
             * o background.jpg fica bastante visível.
             */

            background:
                rgba(
                    250,
                    233,
                    194,
                    0.58
                );

            backdrop-filter:
                blur(4px);

            -webkit-backdrop-filter:
                blur(4px);

            padding:
                52px 34px;

            border-radius: 20px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.42
                );

            box-shadow:
                0 20px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );
        }


        /* =========================================================
           IDIOMAS
           ========================================================= */

        .lang-bar {

            display: flex;

            justify-content: center;

            gap: 20px;

            margin-bottom: 30px;
        }


        .lang-btn {

            background: none;

            border: none;

            color:
                var(--sage-green);

            font-family:
                'Montserrat',
                sans-serif;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 2px;

            cursor: pointer;

            opacity: 0.4;

            padding-bottom: 4px;

            transition:
                all 0.3s ease;
        }


        .lang-btn.active {

            opacity: 1;

            border-bottom:
                2px solid
                var(--sage-green);
        }


        /* =========================================================
           NOMES
           ========================================================= */

        .names-title {

            font-family:
                'Allura',
                cursive;

            font-size: 86px;

            color:
                var(--sage-green);

            line-height: 0.95;

            margin-bottom: 24px;
        }


        .name-line {
            display: block;
        }


        /* =========================================================
           FRASE
           ========================================================= */

        .quote-phrase {

            font-family:
                'Montserrat',
                sans-serif;

            font-size: 16px;

            font-weight: 400;

            color:
                var(--sage-green);

            line-height: 1.7;

            max-width: 540px;

            margin:
                0 auto 34px;
        }


        /* =========================================================
           FOTO + MOLDURA
           ========================================================= */

        .photo-frame-wrapper {

            position: relative;

            width:
                min(
                    390px,
                    82vw
                );

            aspect-ratio:
                0.75 / 1;

            margin:
                0 auto 40px;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        .couple-photo {

            position: absolute;

            width: 92%;
            height: 92%;

            object-fit: cover;

            border-radius:
                120px
                120px
                12px
                12px;

            z-index: 1;

            box-shadow:
                0 10px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );
        }


        .floral-overlay-img {

            position: absolute;

            top: -4%;
            left: -4%;

            width: 108%;
            height: 108%;

            object-fit: contain;

            z-index: 2;

            pointer-events: none;
        }


        /* =========================================================
           DATA / LOCAL
           ========================================================= */

        .event-details {

            margin-bottom: 30px;
        }


        .date-text {

            font-size: 32px;

            font-weight: 700;

            letter-spacing: 2px;

            color:
                var(--sage-green);

            margin:
                10px 0 20px;
        }


        .location-info {

            font-size: 14px;

            font-weight: 400;

            line-height: 1.7;

            color:
                #3b4239;

            margin-bottom: 24px;
        }


        /* =========================================================
           BOTÕES
           ========================================================= */

        .buttons-group {

            display: flex;

            flex-direction: column;

            gap: 13px;

            margin-bottom: 30px;

            align-items: center;
        }


        .action-btn {

            display: inline-block;

            text-decoration: none;

            font-family:
                'Montserrat',
                sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            padding:
                15px 28px;

            border-radius: 30px;

            width: 100%;

            max-width: 290px;

            transition:
                all 0.3s ease;
        }


        .action-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 7px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );
        }


        .btn-site {

            background:
                var(--sage-green);

            color: white;
        }


        .btn-gifts {

            background:
                #E8D8B0;

            color:
                #4a3a0f;
        }


        .btn-map {

            background:
                rgba(
                    143,
                    184,
                    222,
                    0.78
                );

            color:
                #29445d;
        }


        /* =========================================================
           IBAN
           ========================================================= */

        .iban-container {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            font-family:
                monospace;

            font-size: 10px;

            color:
                var(--text-dark);

            margin-top: 10px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(
                    106,
                    123,
                    94,
                    0.20
                );

            flex-wrap: wrap;
        }


        #iban-code {

            word-break:
                break-all;
        }


        .copy-link {

            background: none;

            border: none;

            color:
                var(--sage-green);

            font-family:
                'Montserrat',
                sans-serif;

            font-weight: 600;

            cursor: pointer;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1px;

            padding:
                2px 6px;

            transition:
                opacity 0.2s ease;
        }


        .copy-link:hover {

            opacity: 0.7;
        }


        /* =========================================================
           TABLET / DESKTOP
           ========================================================= */

        @media (min-width: 768px) {

            .buttons-group {

                flex-direction: row;

                justify-content: center;

                flex-wrap: wrap;
            }

            .action-btn {

                width: auto;

                min-width: 180px;
            }
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            html,
            body {

                width: 100%;
                min-width: 0;

                overflow-x: hidden;
            }


            /* -----------------------------------------------------
               ENVELOPE MOBILE

               Mantemos a proporção.
               O envelope é aumentado, mas nunca "achatado".
               ----------------------------------------------------- */

            #envelope-screen {

                width: 100vw;

                height: 100dvh;

                min-height:
                    100svh;

                overflow: hidden;
            }


            .env-corpo-img,
            .env-aba-img {

                width: 150vw;

                height: 150vw;

                min-width: 150vw;
                min-height: 150vw;

                max-width: none;
                max-height: none;

                left: 50%;
                top: 50%;

                object-fit: cover;

                object-position:
                    center center;

                transform:
                    translate(
                        -50%,
                        -50%
                    );
            }


            /*
             * Em telemóveis muito altos,
             * aumentamos um pouco mais a escala,
             * mas continuamos a preservar a proporção.
             */

            @media (min-aspect-ratio: 1/1.8) {

                .env-corpo-img,
                .env-aba-img {

                    width: 165vw;
                    height: 165vw;
                }
            }


            .selo-img {

                width:
                    clamp(
                        140px,
                        31vw,
                        195px
                    );

                top: 55%;
            }


            .open-hint-text {

                bottom: 5%;

                font-size: 9px;

                letter-spacing: 3px;
            }


            /* -----------------------------------------------------
               SITE MOBILE
               ----------------------------------------------------- */

            #main-site {

                min-height: 100dvh;

                padding:
                    22px 12px;

                align-items:
                    flex-start;

                background-attachment:
                    scroll;

                background-position:
                    center center;
            }


            /*
             * Painel bastante mais transparente no telemóvel.
             * A imagem atrás fica claramente visível.
             */

            .content-wrapper {

                width: 100%;

                max-width:
                    100%;

                padding:
                    40px 20px;

                border-radius: 18px;

                background:
                    rgba(
                        250,
                        233,
                        194,
                        0.48
                    );

                backdrop-filter:
                    blur(3px);

                -webkit-backdrop-filter:
                    blur(3px);

                border:
                    1px solid
                    rgba(
                        255,
                        255,
                        255,
                        0.38
                    );

                box-shadow:
                    0 15px 35px
                    rgba(
                        0,
                        0,
                        0,
                        0.10
                    );
            }


            .lang-bar {

                gap: 18px;

                margin-bottom: 24px;
            }


            .names-title {

                font-size: 65px;

                line-height: 0.95;

                margin-bottom: 20px;
            }


            .quote-phrase {

                font-size: 15px;

                line-height: 1.65;

                margin-bottom: 30px;
            }


            .photo-frame-wrapper {

                width:
                    min(
                        360px,
                        88vw
                    );

                aspect-ratio:
                    0.75 / 1;

                margin-bottom: 32px;
            }


            .couple-photo {

                width: 92%;
                height: 92%;
            }


            .floral-overlay-img {

                width: 108%;
                height: 108%;
            }


            .date-text {

                font-size: 29px;

                font-weight: 700;

                letter-spacing: 1.5px;

                margin:
                    8px 0 17px;
            }


            .location-info {

                font-size: 13px;

                line-height: 1.65;
            }


            .buttons-group {

                gap: 11px;

                margin-bottom: 25px;
            }


            .action-btn {

                max-width:
                    290px;

                padding:
                    14px 22px;
            }


            .iban-container {

                font-size: 9px;

                gap: 5px;

                padding-top: 16px;
            }


            .copy-link {

                font-size: 8px;
            }
        }


        /* =========================================================
           TELEMÓVEIS MUITO PEQUENOS
           ========================================================= */

        @media (max-width: 380px) {

            .content-wrapper {

                padding:
                    34px 16px;
            }


            .names-title {

                font-size: 58px;
            }


            .quote-phrase {

                font-size: 14px;
            }


            .photo-frame-wrapper {

                width: 86vw;
            }


            .date-text {

                font-size: 26px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         ENVELOPE
         ========================================================= -->

    <div
        id="envelope-screen"
        onclick="openEnvelope()"
    >

        <img
            src="envelope-corpo.png"
            alt="Corpo do Envelope"
            class="env-corpo-img"
        >


        <div class="env-aba-container">

            <img
                src="envelope-aba.png"
                alt="Aba do Envelope"
                class="env-aba-img"
            >

        </div>


        <img
            src="selo.png"
            alt="Selo de Cera"
            class="selo-img"
            onerror="this.style.display='none';"
        >


        <p
            class="open-hint-text"
            id="txt-hint"
        >
            Clique para abrir
        </p>

    </div>



    <!-- =========================================================
         SITE PRINCIPAL
         ========================================================= -->

    <div id="main-site">

        <div class="content-wrapper">


            <!-- IDIOMAS -->

            <div class="lang-bar">

                <button
                    class="lang-btn"
                    onclick="setLang('pt')"
                    id="btn-pt"
                >
                    PT
                </button>

                <button
                    class="lang-btn"
                    onclick="setLang('en')"
                    id="btn-en"
                >
                    EN
                </button>

                <button
                    class="lang-btn"
                    onclick="setLang('it')"
                    id="btn-it"
                >
                    IT
                </button>

            </div>



            <!-- NOMES -->

            <h1 class="names-title">

                <span class="name-line">
                    Mariana &
                </span>

                <span class="name-line">
                    Filippo
                </span>

            </h1>



            <!-- FRASE -->

            <p
                class="quote-phrase"
                id="txt-phrase"
            >
                Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.
            </p>



            <!-- FOTO -->

            <div class="photo-frame-wrapper">

                <img
                    src="foto-noivos.jpg"
                    alt="Mariana & Filippo"
                    class="couple-photo"
                >

                <img
                    src="moldura.png"
                    alt="Moldura Floral"
                    class="floral-overlay-img"
                    onerror="this.style.display='none';"
                >

            </div>



            <!-- DATA / LOCAL -->

            <div class="event-details">

                <div
                    class="date-text"
                    id="txt-date"
                >
                    07 . 08 . 2027
                </div>


                <div
                    class="location-info"
                    id="txt-location"
                >
                    <strong>Ca' Salva</strong><br>
                    Teolo, Italy
                </div>

            </div>



            <!-- BOTÕES -->

            <div class="buttons-group">

                <a
                    href="https://marianafilippo.pt"
                    target="_blank"
                    rel="noopener"
                    class="action-btn btn-site"
                    id="txt-btn-site"
                >
                    O Nosso Site
                </a>


                <a
                    href="https://marianafilippo.pt/#presentes"
                    target="_blank"
                    rel="noopener"
                    class="action-btn btn-gifts"
                    id="txt-btn-gifts"
                >
                    Lista de Presentes
                </a>


                <a
                    href="https://www.google.com/maps/search/?api=1&query=Ca%27+Salva%2C+Teolo%2C+Italy"
                    target="_blank"
                    rel="noopener"
                    class="action-btn btn-map"
                    id="txt-btn-map"
                >
                    Ver no mapa
                </a>

            </div>



            <!-- IBAN -->

            <div class="iban-container">

                <span id="iban-code">
                    PT50003300004572499102105
                </span>


                <button
                    class="copy-link"
                    onclick="copyIBAN()"
                    id="txt-copy"
                >
                    Copiar
                </button>

            </div>


        </div>

    </div>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        const texts = {

            pt: {

                hint:
                    "Clique para abrir",

                phrase:
                    "Com imensa alegria, convidamo-vos a celebrar connosco a união do nosso amor.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Italy",

                btnSite:
                    "O Nosso Site",

                btnGifts:
                    "Lista de Presentes",

                btnMap:
                    "Ver no mapa",

                copy:
                    "Copiar",

                copied:
                    "Copiado"
            },


            en: {

                hint:
                    "Click to open",

                phrase:
                    "With endless joy, we invite you to celebrate our wedding day with us.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Italy",

                btnSite:
                    "Our Website",

                btnGifts:
                    "Gift Registry",

                btnMap:
                    "View on map",

                copy:
                    "Copy",

                copied:
                    "Copied"
            },


            it: {

                hint:
                    "Clicca per aprire",

                phrase:
                    "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",

                date:
                    "07 . 08 . 2027",

                location:
                    "<strong>Ca' Salva</strong><br>Teolo, Italia",

                btnSite:
                    "Il Nostro Sito",

                btnGifts:
                    "Lista Nozze",

                btnMap:
                    "Vedi sulla mappa",

                copy:
                    "Copia",

                copied:
                    "Copiato"
            }

        };


        let currentLang = 'pt';



        /* =========================================================
           IDIOMA AUTOMÁTICO
           ========================================================= */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                const browserLang =
                    (
                        navigator.language ||
                        navigator.userLanguage
                    )
                    .slice(0, 2)
                    .toLowerCase();


                const supportedLangs =
                    ['pt', 'en', 'it'];


                if (
                    supportedLangs.includes(
                        browserLang
                    )
                ) {

                    setLang(browserLang);

                } else {

                    setLang('pt');
                }

            }
        );



        /* =========================================================
           ABRIR ENVELOPE
           ========================================================= */

        function openEnvelope() {

            const screen =
                document.getElementById(
                    'envelope-screen'
                );


            const mainSite =
                document.getElementById(
                    'main-site'
                );


            if (
                screen.classList.contains(
                    'opening'
                )
            ) {

                return;
            }


            /*
             * O site aparece imediatamente
             * por trás do envelope.
             */

            mainSite.classList.add(
                'visible'
            );


            /*
             * Começa a abertura.
             */

            screen.classList.add(
                'opening'
            );


            /*
             * Depois da animação,
             * retiramos completamente
             * o envelope.
             */

            setTimeout(
                () => {

                    screen.classList.add(
                        'opened'
                    );

                },
                1250
            );

        }



        /* =========================================================
           IDIOMAS
           ========================================================= */

        function setLang(lang) {

            currentLang = lang;

            const t =
                texts[lang];


            document
                .getElementById(
                    'txt-hint'
                )
                .innerText =
                t.hint;


            document
                .getElementById(
                    'txt-phrase'
                )
                .innerText =
                t.phrase;


            document
                .getElementById(
                    'txt-date'
                )
                .innerText =
                t.date;


            document
                .getElementById(
                    'txt-location'
                )
                .innerHTML =
                t.location;


            document
                .getElementById(
                    'txt-btn-site'
                )
                .innerText =
                t.btnSite;


            document
                .getElementById(
                    'txt-btn-gifts'
                )
                .innerText =
                t.btnGifts;


            document
                .getElementById(
                    'txt-btn-map'
                )
                .innerText =
                t.btnMap;


            document
                .getElementById(
                    'txt-copy'
                )
                .innerText =
                t.copy;


            document
                .querySelectorAll(
                    '.lang-btn'
                )
                .forEach(
                    btn =>
                        btn.classList.remove(
                            'active'
                        )
                );


            document
                .getElementById(
                    `btn-${lang}`
                )
                .classList.add(
                    'active'
                );

        }



        /* =========================================================
           COPIAR IBAN
           ========================================================= */

        function copyIBAN() {

            const iban =
                document
                    .getElementById(
                        'iban-code'
                    )
                    .innerText
                    .trim();


            navigator.clipboard
                .writeText(iban)
                .then(
                    () => {

                        const btn =
                            document
                                .getElementById(
                                    'txt-copy'
                                );


                        btn.innerText =
                            texts[
                                currentLang
                            ].copied;


                        setTimeout(
                            () => {

                                btn.innerText =
                                    texts[
                                        currentLang
                                    ].copy;

                            },
                            2000
                        );

                    }
                );

        }

    </script>

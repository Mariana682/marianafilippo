<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mariana & Filippo</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-beige: #FAE9C2;
            --accent-gold: #F7D586;
            --soft-blue: #8FB8DE;
            --sage-green: #748B68;
            --dark-sage: #526349;
            --text-main: #333d30;
            --gold-border: #d4a944;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1a2018;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            letter-spacing: 0.5px;
        }

        /* --- TELA FULLSCREEN DO ENVELOPE --- */
        #envelope-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #151a13;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            perspective: 1200px;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
        }

        .envelope-body {
            position: relative;
            width: 100%;
            max-width: 460px;
            height: 100vh;
            max-height: 820px;
            background: linear-gradient(165deg, var(--sage-green) 0%, var(--dark-sage) 100%);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            border-left: 1px solid rgba(255,255,255,0.08);
            border-right: 1px solid rgba(255,255,255,0.08);
        }

        /* Aba Superior do Envelope com corte elegante */
        .envelope-top-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, #627658 0%, var(--sage-green) 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 4;
            border-bottom: 1px solid rgba(247, 213, 134, 0.3);
        }

        /* Encaixe Inferior */
        .envelope-bottom-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(0deg, #485840 0%, var(--sage-green) 100%);
            clip-path: polygon(0 100%, 100% 100%, 100% 0, 50% 45%, 0 0);
            z-index: 3;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
        }

        /* Selo de Cera 3D */
        .wax-seal-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 78px;
            height: 78px;
            background: radial-gradient(circle at 35% 35%, #fff2be 0%, var(--accent-gold) 50%, #b88d2a 100%);
            border-radius: 50%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.8), inset 0 -3px 6px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: transform 0.4s ease, opacity 0.6s ease;
            border: 2px solid #e2b64d;
        }

        .wax-seal-btn::after {
            content: '';
            position: absolute;
            width: 66px;
            height: 66px;
            border: 1px dashed rgba(92, 69, 17, 0.4);
            border-radius: 50%;
        }

        .wax-seal-text {
            font-family: 'Allura', cursive;
            font-size: 28px;
            font-weight: bold;
            color: #4a380e;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.4);
            z-index: 6;
        }

        .open-instructions {
            position: absolute;
            bottom: 40px;
            color: var(--accent-gold);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.8;
            animation: fadeInOut 2.5s infinite;
            z-index: 5;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 0.9; transform: translateY(-3px); }
        }

        /* Animação ao Abrir */
        .is-open .envelope-top-flap {
            transform: rotateX(180deg);
            z-index: 2;
        }

        .is-open .wax-seal-btn {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.4);
        }

        #envelope-container.hide-envelope {
            opacity: 0;
            visibility: hidden;
        }


        /* --- CARTÃO / CONVITE PRINCIPAL --- */
        .invitation-card {
            width: 100%;
            max-width: 500px;
            min-height: 90vh;
            margin: 20px auto;
            
            /* CARREGAR A TUA IMAGEM DE FUNDO DO GITHUB OU USA O FALLBACK BEGE */
            background-color: var(--bg-beige);
            background-image: url('fundo-papel.jpg');
            background-size: cover;
            background-position: center;
            
            border-radius: 4px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            padding: 45px 30px;
            text-align: center;
            position: relative;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
            border: 1px solid rgba(212, 169, 68, 0.3);
        }

        .invitation-card.show-card {
            opacity: 1;
            transform: translateY(0);
        }

        /* Seletor de Idioma Discreto */
        .lang-picker {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .lang-opt {
            background: none;
            border: none;
            color: var(--sage-green);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0.5;
            padding-bottom: 2px;
            transition: all 0.3s ease;
        }

        .lang-opt.active {
            opacity: 1;
            border-bottom: 1.5px solid var(--sage-green);
        }

        /* Nomes Principais */
        .names-header {
            font-family: 'Allura', cursive;
            font-size: 64px;
            color: var(--sage-green);
            font-weight: normal;
            line-height: 1;
            margin-bottom: 18px;
        }

        @media (min-width: 480px) {
            .names-header { font-size: 76px; }
        }

        .subtitle-text {
            font-size: 13px;
            font-weight: 300;
            font-style: italic;
            color: #555;
            line-height: 1.7;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        /* Moldura de Foto Arredondada */
        .couple-photo-wrapper {
            width: 170px;
            height: 230px;
            margin: 0 auto 35px;
            border-radius: 90px 90px 8px 8px;
            overflow: hidden;
            border: 1px solid var(--gold-border);
            padding: 5px;
            background: rgba(255,255,255,0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        .couple-photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 85px 85px 4px 4px;
        }

        /* Bloco do Evento */
        .event-info {
            margin-bottom: 35px;
            padding: 20px 10px;
            border-top: 1px solid rgba(116, 139, 104, 0.2);
            border-bottom: 1px solid rgba(116, 139, 104, 0.2);
        }

        .date-display {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--sage-green);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .venue-details {
            font-size: 13px;
            font-weight: 300;
            line-height: 1.6;
            color: #4a4a4a;
            margin-bottom: 18px;
        }

        /* Estilo Elegante dos Botões */
        .btn-link {
            display: inline-block;
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            padding: 12px 22px;
            border-radius: 30px;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn-maps {
            background-color: transparent;
            color: var(--dark-sage);
            border: 1px solid var(--dark-sage);
        }

        .btn-site {
            background-color: var(--sage-green);
            color: #ffffff;
        }

        .btn-gifts {
            background-color: var(--accent-gold);
            color: #4d3b0f;
        }

        .btn-link:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .nav-buttons {
            margin-bottom: 40px;
        }

        /* Rodapé IBAN Discreto */
        .iban-container {
            font-size: 11px;
            font-weight: 300;
            color: #666;
            padding-top: 20px;
        }

        .iban-label {
            margin-bottom: 8px;
            font-style: italic;
        }

        .iban-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.06);
        }

        .copy-trigger {
            background: none;
            border: none;
            color: var(--sage-green);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <!-- 1. ENVELOPE FULLSCREEN (PRIMEIRO IMPACTO) -->
    <div id="envelope-container">
        <div class="envelope-body" id="envelope">
            <div class="envelope-top-flap"></div>
            
            <div class="wax-seal-btn">
                <span class="wax-seal-text">M&F</span>
            </div>

            <div class="envelope-bottom-pocket"></div>
            <p class="open-instructions" id="txt-hint">Toque para abrir</p>
        </div>
    </div>


    <!-- 2. CARTÃO DO CONVITE (SURGE APÓS ABRIR) -->
    <div class="invitation-card" id="main-card">
        
        <!-- Idiomas -->
        <div class="lang-picker">
            <button class="lang-opt active" onclick="switchLang('pt')">PT</button>
            <button class="lang-opt" onclick="switchLang('en')">EN</button>
            <button class="lang-opt" onclick="switchLang('it')">IT</button>
        </div>

        <!-- Nomes -->
        <h1 class="names-header">Mariana & Filippo</h1>

        <!-- Frase de Abertura -->
        <p class="subtitle-text" id="txt-phrase">
            Com imensa alegria, convidamo-vos a celebrar o nosso casamento connosco.
        </p>

        <!-- Foto do Casal (GITHUB: foto-noivos.jpg) -->
        <div class="couple-photo-wrapper">
            <img src="foto-noivos.jpg" alt="Mariana & Filippo" onerror="this.src='https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=600&auto=format&fit=crop'">
        </div>

        <!-- Detalhes do Dia -->
        <div class="event-info">
            <div class="date-display" id="txt-date">07 . 08 . 2027 • 16:00</div>
            <div class="venue-details" id="txt-venue">
                <strong>Quinta dos Sonhos</strong><br>
                Coimbra, Portugal
            </div>
            <a href="https://maps.google.com" target="_blank" class="btn-link btn-maps" id="txt-btn-maps">Ver no Mapa</a>
        </div>

        <!-- Links Principais -->
        <div class="nav-buttons">
            <a href="https://marianafilippo.pt" target="_blank" class="btn-link btn-site" id="txt-btn-site">O Nosso Site</a>
            <a href="https://marianafilippo.pt/#presentes" target="_blank" class="btn-link btn-gifts" id="txt-btn-gifts">Lista de Presentes</a>
        </div>

        <!-- IBAN Subtil -->
        <div class="iban-container">
            <p class="iban-label" id="txt-iban-label">Para quem desejar mimar-nos diretamente:</p>
            <div class="iban-box">
                <span id="iban-val">PT50 0000 0000 0000 0000 0000 0</span>
                <button class="copy-trigger" onclick="copyIban()" id="txt-copy">Copiar</button>
            </div>
        </div>

    </div>

    <script>
        /* Traduções Elegantes */
        const i18n = {
            pt: {
                hint: "Toque para abrir",
                phrase: "Com imensa alegria, convidamo-vos a celebrar o nosso casamento connosco.",
                date: "07 . 08 . 2027 • 16:00",
                venue: "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portugal",
                maps: "Ver no Mapa",
                site: "O Nosso Site",
                gifts: "Lista de Presentes",
                ibanLabel: "Para quem nos perguntou e deseja mimar-nos diretamente:",
                copy: "Copiar",
                copied: "Copiado"
            },
            en: {
                hint: "Tap to open",
                phrase: "With endless joy, we invite you to celebrate our wedding day with us.",
                date: "07 . 08 . 2027 • 4:00 PM",
                venue: "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portugal",
                maps: "View Map",
                site: "Our Website",
                gifts: "Gift Registry",
                ibanLabel: "For those who kindly asked and wish to gift us directly:",
                copy: "Copy",
                copied: "Copied"
            },
            it: {
                hint: "Tocca per aprire",
                phrase: "Con immensa gioia, vi invitiamo a festeggiare il nostro matrimonio con noi.",
                date: "07 . 08 . 2027 • ore 16:00",
                venue: "<strong>Quinta dos Sonhos</strong><br>Coimbra, Portogallo",
                maps: "Vedi Mappa",
                site: "Il Nostro Sito",
                gifts: "Lista Nozze",
                ibanLabel: "Per chi desidera farci un pensiero in modo diretto:",
                copy: "Copia",
                copied: "Copiato"
            }
        };

        let activeLang = 'pt';

        /* Abertura do Envelope */
        const envelope = document.getElementById('envelope');
        const envelopeContainer = document.getElementById('envelope-container');
        const mainCard = document.getElementById('main-card');

        envelope.addEventListener('click', () => {
            envelopeContainer.classList.add('is-open');
            setTimeout(() => {
                envelopeContainer.classList.add('hide-envelope');
                mainCard.classList.add('show-card');
            }, 800);
        });

        /* Alterar Idioma */
        function switchLang(lang) {
            activeLang = lang;
            const data = i18n[lang];

            document.getElementById('txt-hint').innerText = data.hint;
            document.getElementById('txt-phrase').innerText = data.phrase;
            document.getElementById('txt-date').innerText = data.date;
            document.getElementById('txt-venue').innerHTML = data.venue;
            document.getElementById('txt-btn-maps').innerText = data.maps;
            document.getElementById('txt-btn-site').innerText = data.site;
            document.getElementById('txt-btn-gifts').innerText = data.gifts;
            document.getElementById('txt-iban-label').innerText = data.ibanLabel;
            document.getElementById('txt-copy').innerText = data.copy;

            document.querySelectorAll('.lang-opt').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });
        }

        /* Copiar IBAN */
        function copyIban() {
            const iban = document.getElementById('iban-val').innerText;
            navigator.clipboard.writeText(iban).then(() => {
                const btn = document.getElementById('txt-copy');
                btn.innerText = i18n[activeLang].copied;
                setTimeout(() => btn.innerText = i18n[activeLang].copy, 2000);
            });
        }
    </script>
</body>
</html>
